name: Build and deploy research draft
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback:
        description: Restore original production package without preview
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-single-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab==4.4.3
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
  preview:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: c1efd63b66ccb8d9c620f92d2cbbbcd3cbdd5656
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: ${{ !inputs.rollback }}
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: ${{ !inputs.rollback }}
        with:
          python-version: '3.12'
      - run: pip install reportlab==4.4.3
        if: ${{ !inputs.rollback }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
        if: ${{ !inputs.rollback }}
      - run: npm ci --no-audit --no-fund
        if: ${{ !inputs.rollback }}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
        if: ${{ !inputs.rollback }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !inputs.rollback }}
      - name: Find preserved production artifact
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, name: 'pages-production-baseline-606908b', per_page: 100});
            const archive = artifacts.find(a => !a.expired);
            core.setOutput('artifact', archive ? archive.id : 11662297630);
            core.setOutput('run', archive ? archive.workflow_run.id : 38033011709);
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          merge-multiple: true
          path: baseline-archive
      - name: Verify immutable production archive
        run: |
          echo '66f0e355e2fb024d6114e0161fe1811e9844bacd64c5ff62308a1ff9adf37e68  baseline-archive/artifact.tar' | sha256sum -c -
          mkdir baseline-dist
          tar --no-same-owner -xf baseline-archive/artifact.tar -C baseline-dist
      - uses: actions/upload-artifact@v4
        with:
          name: pages-production-baseline-606908b
          path: baseline-archive/artifact.tar
          retention-days: 90
          compression-level: 0
      - run: npm run check
        if: ${{ !inputs.rollback }}
      - run: node --test tests/*.test.mjs
        if: ${{ !inputs.rollback }}
      - run: node scripts/verify-control-preservation.mjs
        if: ${{ !inputs.rollback }}
      - run: python scripts/verify_evidence.py
        if: ${{ !inputs.rollback }}
      - run: npm run build
        if: ${{ !inputs.rollback }}
        env:
          BASE_PATH: /kleines-schaeferrad/review/pr-18
          PUBLIC_STORAGE_NAMESPACE: ks-preview-pr18
      - run: node scripts/compose-pages-preview.mjs baseline-dist dist combined-dist
        if: ${{ !inputs.rollback }}
      - run: node tests/browser-pages-preview.mjs
        if: ${{ !inputs.rollback }}
      - run: node scripts/verify-published-production.mjs
        if: ${{ !inputs.rollback }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-preview-validation
          path: test-results/
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.rollback && 'baseline-dist' || 'combined-dist' }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preserved production plus optional preview
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.ref == 'refs/heads/main' && !inputs.rollback
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1efd63b66ccb8d9c620f92d2cbbbcd3cbdd5656
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: pages-preview-validation
          path: test-results
      - name: Browser acceptance against published HTTPS URL
        run: node tests/browser-pages-preview.mjs
        env:
          KS_REVIEW_URL: https://jdistlr.github.io/kleines-schaeferrad/review/pr-18/
          KS_TEST_OUTPUT: test-results/pages-preview-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-preview-live-evidence
          path: test-results/
          retention-days: 90
