<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">Entwurf einer Messkarte für einen Krümmling</title><desc id="desc">Nichtmetrische schematische Ansicht. Blaue Linie A bis B zeigt die axiale Messstrecke. 140 Millimeter sind eine Fachauskunft, keine Ist-Messung. Eine zweite offene Eigenschaft ist ocker gestrichelt. Alle realen Endpunkte sind vor Ort zu bestätigen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236b90"/></marker></defs>
<rect width="1000" height="720" fill="#fafbf7"/><g font-family="Arial,sans-serif" fill="#172b25">
<text x="36" y="48" font-size="16">KLEINES SCHÄFERRAD · WERKSTATT · ENTWURF</text><text x="36" y="94" font-size="30" font-weight="bold">Krümmling — axiale Dicke prüfen</text>
<text x="36" y="128" font-size="18">COMP-KRUEMMLINGE · reale Teil-ID offen · ITER-003</text><path d="M36 151H964" stroke="#dce2d9"/>
<text x="36" y="184" font-size="16" fill="#8b5c10">SCHEMA OHNE MASSSTAB · KEINE IST-GEOMETRIE</text>
<path d="M160 245 Q290 207 420 245 L420 384 Q290 346 160 384 Z" fill="#edf1e7" stroke="#172b25" stroke-width="2"/>
<path d="M160 245V211 M420 245V211" stroke="#236b90" stroke-width="2"/><path d="M165 218H415" stroke="#236b90" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="151" y="205" font-size="18" fill="#236b90">A</text><text x="414" y="205" font-size="18" fill="#236b90">B</text>
<text x="175" y="283" font-size="18">Axiale Messstrecke</text><text x="196" y="317" font-size="24" fill="#236b90">Ist-Wert offen</text>
<path d="M455 249V379" stroke="#a77625" stroke-width="3" stroke-dasharray="7 5"/><text x="478" y="305" font-size="17" fill="#8b5c10">C–D offen</text><text x="478" y="331" font-size="15" fill="#8b5c10">eigene Frage</text>
<text x="36" y="429" font-size="17">A: äußere Stirnfläche · B: innere Stirnfläche desselben Segments</text><text x="36" y="456" font-size="16">Endpunkte und Teilinstanz im Originalfoto vor Ort bestätigen.</text><path d="M36 479H964" stroke="#dce2d9"/>
<text x="36" y="514" font-size="18">Fachauskunft</text><text x="300" y="514" font-size="18">140 mm · Thorsten · TH-20261009-26</text>
<text x="36" y="550" font-size="18">Ist-Messung</text><text x="300" y="550" font-size="18" fill="#8b5c10">Offen · Einheit mm · Werkzeug / Unsicherheit fehlen</text>
<text x="36" y="586" font-size="18">Bestätigung</text><text x="300" y="586" font-size="18">Keine Feldfreigabe · Quelle und Review erforderlich</text>
<path d="M36 609H964" stroke="#dce2d9"/><text x="36" y="644" font-size="20" font-weight="bold" fill="#193e35">Was entscheidet diese Messung?</text><text x="36" y="675" font-size="17">Mit TH-25 die Maßkette TH-28/29 prüfen; kein Nachweis des Nagelwegs.</text>
</g></svg>
