<title>Kleines Schäferrad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Werkbank: oben eine schmale Leiste, links immer das Rad, rechts eine Karte, die nur in sich scrollt. */
:root {
  --papier: #edf1ec; --flaeche: #f6f8f5; --tinte: #1c2726; --leise: #5f6d6a; --linie: #c9d1cc;
  --wasser: #2b6a76; --wasser-hauch: #d6e6e8; --roetel: #a5412a; --roetel-hauch: #f3e2dc;
  --eiche: #4f6f2a; --holz: #e2d8c6; --holz-dunkel: #b9a88c; --fluss: #c9dcdc;
  --serif: "Alegreya", "Iowan Old Style", Georgia, serif;
  --sans: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --m1: .8125rem; --m2: .9375rem; --m3: 1.0625rem; --m4: 1.3125rem; --m5: 1.75rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papier: #121817; --flaeche: #1a2120; --tinte: #dfe6e2; --leise: #9aa8a4; --linie: #33403d;
  --wasser: #86bec7; --wasser-hauch: #20393d; --roetel: #e48c71; --roetel-hauch: #3a2520; --eiche: #a9c77a;
  --holz: #3a352b; --holz-dunkel: #6f6450; --fluss: #1d3033; color-scheme: dark; } }
:root[data-theme="dark"] {
  --papier: #121817; --flaeche: #1a2120; --tinte: #dfe6e2; --leise: #9aa8a4; --linie: #33403d;
  --wasser: #86bec7; --wasser-hauch: #20393d; --roetel: #e48c71; --roetel-hauch: #3a2520; --eiche: #a9c77a;
  --holz: #3a352b; --holz-dunkel: #6f6450; --fluss: #1d3033; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--papier); color: var(--tinte); font: 400 var(--m3)/1.5 var(--sans); margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--wasser); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--wasser); outline-offset: 2px; border-radius: 3px; }
.leise { color: var(--leise); }
.zahl { font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); max-width: 1440px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); }

.leiste { display: flex; align-items: center; gap: 10px 24px; flex-wrap: wrap; padding-block: 14px; border-bottom: 1px solid var(--linie); }
.leiste h1 { font: 700 var(--m4)/1 var(--serif); margin: 0; white-space: nowrap; }
.leiste h1 a { color: inherit; text-decoration: none; }
.stand-mini { display: flex; align-items: center; gap: 10px; font-size: var(--m2); color: var(--leise); }
.stand-mini .balken { width: 120px; height: 6px; border-radius: 3px; background: var(--linie); overflow: hidden; display: flex; }
.balken i { display: block; height: 100%; }
.suche { position: relative; margin-left: auto; flex: 0 1 320px; min-width: 200px; }
.suche input { width: 100%; padding: 8px 12px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); }
.suche input::placeholder { color: var(--leise); }
.treffer-liste { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); max-height: 60vh; overflow: auto; }
.treffer-liste li { padding: 7px 10px; border-radius: 4px; cursor: pointer; }
.treffer-liste li[aria-selected="true"], .treffer-liste li:hover { background: var(--wasser-hauch); }
.treffer-liste small { display: block; color: var(--leise); font-size: var(--m1); }

.werkbank { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, 1fr); gap: 32px; min-height: 0; padding-top: 16px; }
.rad { min-height: 0; display: flex; flex-direction: column; position: relative; }
.rad svg#aufriss { width: 100%; height: auto; max-height: calc(100% - 52px); display: block; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0; padding: 0; list-style: none; font-size: var(--m1); color: var(--leise); }
.legende li { display: flex; align-items: center; gap: 6px; }
.legende svg { width: 22px; height: 12px; }
.etikett { position: absolute; pointer-events: none; background: var(--tinte); color: var(--papier); font-size: var(--m2); padding: 3px 9px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 5; }

svg .teil { cursor: pointer; }
svg .teil .form { fill: var(--holz); stroke: var(--tinte); stroke-width: 1.3; transition: fill .15s; }
svg .teil .treffer { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; }
svg .teil.leer .form { fill: none; stroke-dasharray: 4 3; stroke: var(--leise); }
svg .teil.bestaetigt .form { fill: color-mix(in srgb, var(--eiche) 32%, var(--holz)); }
svg .teil:hover .form, svg .teil:focus-visible .form { fill: var(--wasser-hauch); }
svg .teil.gewaehlt .form { stroke: var(--wasser); stroke-width: 2.4; fill: var(--wasser-hauch); }
svg .teil:focus-visible { outline: none; }
svg .marke circle { fill: var(--roetel); stroke: var(--papier); stroke-width: 2; }
svg .marke text { fill: #fff; font: 700 12px var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
svg .fluss { fill: var(--fluss); }
svg .welle { fill: none; stroke: var(--wasser); stroke-width: 1; opacity: .7; }
svg .gelaende { fill: none; stroke: var(--leise); stroke-width: 1.2; }
svg .schraffur { stroke: var(--linie); stroke-width: 1; }
svg .wasserweg { fill: none; stroke: var(--wasser); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }

.karte { min-height: 0; overflow-y: auto; padding: 4px 6px 48px 2px; overscroll-behavior: contain; }
.zurueck { background: none; border: 0; padding: 4px 0; color: var(--wasser); cursor: pointer; font-size: var(--m2); }
.pfad { color: var(--leise); font-size: var(--m2); margin: 8px 0 2px; }
.karte h2 { font: 700 var(--m5)/1.12 var(--serif); margin: 0; text-wrap: balance; }
.karte h2.frage-titel { font-weight: 500; }
.karte h3 { font: 500 var(--m4)/1.2 var(--serif); margin: 28px 0 10px; }
.karte h3 small { font: 400 var(--m2) var(--sans); color: var(--leise); margin-left: 6px; }
.definition { font: italic 400 var(--m3)/1.45 var(--serif); color: var(--leise); margin: 6px 0 0; max-width: 58ch; }
.auch { font-size: var(--m2); color: var(--leise); margin: 6px 0 0; }
.hinweis { margin: 12px 0 0; padding: 10px 14px; background: var(--flaeche); border-left: 3px solid var(--holz-dunkel); font-size: var(--m2); max-width: 62ch; }
.einstieg { font: 400 var(--m4)/1.35 var(--serif); margin: 0; max-width: 36ch; text-wrap: balance; }
.klein { font-size: var(--m2); margin: 0 0 4px; }

.wissen { margin: 18px 0 0; padding: 14px 16px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; }
.wissen .balken { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--linie); }
.wissen p { margin: 10px 0 0; font-size: var(--m2); }
.wissen dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0; }
.wissen dt { font-size: var(--m1); color: var(--leise); }
.wissen dd { margin: 0; font: 500 var(--m4)/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.wissen dd span { font: 400 var(--m2) var(--sans); color: var(--leise); }

.fragekarte { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; width: 100%; text-align: left; padding: 12px; margin-top: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; cursor: pointer; }
.fragekarte:hover { border-color: var(--wasser); }
.fragekarte.ohne-bild { grid-template-columns: minmax(0, 1fr); }
.fragekarte img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; background: var(--linie); }
.fragekarte b { display: block; font-weight: 500; line-height: 1.35; }
.fragekarte span { display: block; margin-top: 4px; font-size: var(--m1); color: var(--leise); }
.spur { margin-top: 10px; padding: 12px 14px; background: var(--wasser-hauch); border-radius: 8px; font-size: var(--m2); max-width: 62ch; }
.spur b { display: block; font: 500 var(--m1)/1.2 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--wasser); margin-bottom: 4px; }
.spurkarte { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-top: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-left: 3px solid var(--wasser); border-radius: 8px; cursor: pointer; }
.spurkarte:hover { border-color: var(--wasser); }
.spurkarte b { display: block; font-weight: 500; line-height: 1.35; }
.spurkarte span { display: block; margin-top: 4px; font-size: var(--m2); color: var(--leise); }
.belege { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; align-items: center; }
.belege button { padding: 0; border: 1px solid var(--linie); background: var(--linie); border-radius: 4px; cursor: pointer; line-height: 0; }
.belege button:hover { border-color: var(--wasser); }
.belege img { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; display: block; }
.belege .text { font: 400 var(--m1)/1.3 var(--sans); color: var(--wasser); text-decoration: none; }
.belege .mehr { font: 400 var(--m1) var(--sans); color: var(--leise); }
table.angaben .belege img { width: 36px; height: 36px; }
.bildfenster .abgelesen { display: block; width: 100%; color: #fff; font-size: var(--m3); }
.abgleich { display: block; font: 400 var(--m1) var(--sans); margin-top: 3px; }
.abgleich.gleich { color: var(--eiche); }
.abgleich.anders { color: var(--roetel); }
.auftrag { margin-top: 10px; padding: 12px 14px; border: 1px dashed var(--roetel); border-radius: 8px; font-size: var(--m2); max-width: 62ch; }
.auftrag b { display: block; font: 500 var(--m1)/1.2 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--roetel); margin-bottom: 4px; }
.messliste-knopf { display: flex; gap: 12px; align-items: center; width: 100%; margin: 18px 0 0; padding: 12px 14px; text-align: left; background: var(--roetel-hauch); border: 1px solid var(--roetel); border-radius: 8px; cursor: pointer; color: var(--tinte); }
.messliste-knopf b { font-weight: 500; }
.messliste-knopf span { margin-left: auto; color: var(--roetel); font-weight: 500; white-space: nowrap; }
.posten { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 14px 0; border-top: 1px solid var(--linie); }
.posten input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--eiche); }
.posten h4 { margin: 0; font: 500 var(--m3)/1.35 var(--sans); }
.posten h4 a { color: inherit; text-decoration: none; }
.posten p { margin: 6px 0 0; font-size: var(--m2); max-width: 62ch; }
.posten .fotos img { width: 96px; height: 96px; }
.posten.erledigt h4, .posten.erledigt p { color: var(--leise); text-decoration: line-through; text-decoration-thickness: 1px; }
@media print { .rad, .leiste, .zurueck, .posten .fotos, .knopf-zeile { display: none !important; } .app, .werkbank { display: block; height: auto; } .karte { overflow: visible; } body { background: #fff; } }
.fuss { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--linie); font-size: var(--m1); color: var(--leise); }
.figurkachel { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-top: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-left: 3px solid var(--wasser); border-radius: 8px; cursor: pointer; }
.figurkachel:hover { border-color: var(--wasser); }
.figurkachel b { display: block; font: 500 var(--m3)/1.3 var(--serif); }
.figurkachel span { display: block; margin-top: 4px; font-size: var(--m1); color: var(--leise); }
.bildfenster iframe { display: block; width: min(980px, 100%); height: min(86vh, 900px); border: 0; border-radius: 6px; background: var(--papier); }
.fragezeile { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--linie); padding: 10px 2px; cursor: pointer; }
.fragezeile:hover b { color: var(--wasser); }
.fragezeile b { font-weight: 400; }
.fragezeile span { display: block; font-size: var(--m1); color: var(--leise); margin-top: 2px; }
details.gruppe { border-top: 1px solid var(--linie); }
details.gruppe:last-of-type { border-bottom: 1px solid var(--linie); }
details.gruppe > summary { cursor: pointer; padding: 11px 2px; list-style: none; display: flex; gap: 12px; font-weight: 500; }
details.gruppe > summary::-webkit-details-marker { display: none; }
details.gruppe > summary::after { content: "+"; color: var(--leise); width: 1ch; text-align: center; }
details.gruppe[open] > summary::after { content: "–"; }
details.gruppe > summary small { margin-left: auto; color: var(--leise); font-weight: 400; }
details.gruppe .innen { padding-bottom: 8px; }

.masse { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0; }
.masse div { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.masse dt { font-size: var(--m1); color: var(--leise); line-height: 1.3; }
.masse dd { margin: 4px 0 0; font: 500 var(--m4)/1.15 var(--serif); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.masse dd small { display: block; font: 400 var(--m1) var(--sans); color: var(--leise); margin-top: 3px; }
.leer-text { color: var(--leise); font-size: var(--m2); margin: 0; }

.fotos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.fotos button { flex: none; padding: 0; border: 0; background: none; cursor: pointer; position: relative; scroll-snap-align: start; border-radius: 6px; }
.fotos img { width: 128px; height: 128px; object-fit: cover; border-radius: 6px; display: block; background: var(--linie); }
.fotos .art { position: absolute; left: 6px; bottom: 6px; background: rgb(0 0 0 / .62); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 2px 11px; font-size: var(--m2); cursor: pointer; }
.chips button:hover { border-color: var(--wasser); color: var(--wasser); }

details.alle { margin-top: 24px; border-top: 1px solid var(--linie); }
details.alle > summary { cursor: pointer; padding: 12px 0; color: var(--wasser); }
table.angaben { width: 100%; border-collapse: collapse; font-size: var(--m2); }
table.angaben td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--linie); vertical-align: top; }
table.angaben td:first-child { width: 50%; overflow-wrap: anywhere; }
table.angaben td.wert { font-variant-numeric: tabular-nums; font-weight: 500; overflow-wrap: anywhere; }
table.angaben .gruppe td { padding-top: 14px; color: var(--leise); font: italic var(--m2) var(--serif); border-bottom: 0; }
table.angaben .bezug { font-size: var(--m1); color: var(--leise); }
.status { white-space: nowrap; color: var(--leise); font-size: var(--m1); }
.status.bestaetigt { color: var(--eiche); font-weight: 500; }

.antwort { padding: 10px 0; border-top: 1px solid var(--linie); }
.antwort header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: var(--m2); }
.antwort header b { font-weight: 500; }
.antwort header span { color: var(--leise); font-size: var(--m1); }
.antwort p { margin: 4px 0 0; white-space: pre-wrap; }
.antwort header .marker-art { font-size: var(--m1); padding: 0 7px; border-radius: 3px; background: var(--wasser-hauch); color: var(--wasser); }
.antwort header .marker-art.nein { background: var(--roetel-hauch); color: var(--roetel); }
.formular { margin-top: 12px; padding: 14px; border: 1px solid var(--linie); border-radius: 8px; background: var(--flaeche); display: grid; gap: 10px; }
.wahl { display: flex; flex-wrap: wrap; gap: 6px; }
.wahl button { border: 1px solid var(--linie); background: var(--papier); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
.wahl button[aria-pressed="true"] { background: var(--tinte); color: var(--papier); border-color: var(--tinte); }
.formular label { font-size: var(--m2); color: var(--leise); display: grid; gap: 4px; }
.formular textarea, .formular input { width: 100%; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--papier); color: var(--tinte); }
.formular textarea { min-height: 84px; resize: vertical; }
.reihe { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reihe label { flex: 1 1 160px; }
.knopf { border: 0; background: var(--wasser); color: var(--papier); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.knopf:disabled { opacity: .5; cursor: default; }
.nurlesen { font-size: var(--m2); color: var(--leise); margin: 10px 0 0; }

.bildfenster { position: fixed; inset: 0; z-index: 50; background: rgb(10 14 14 / .84); display: grid; place-items: center; padding: 24px 16px; }
.bildfenster figure { margin: 0; max-width: min(960px, 100%); }
.bildfenster img { max-width: 100%; max-height: 78vh; border-radius: 6px; display: block; margin: 0 auto; }
.bildfenster figcaption { color: #e6ecea; font-size: var(--m2); margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
.bildfenster a { color: #9fd0d8; }
.bildfenster > button { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 16px; background: none; border: 0; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; padding: 6px 10px; }
.toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%; transform: translateX(-50%); background: var(--tinte); color: var(--papier); padding: 9px 18px; border-radius: 6px; font-size: var(--m2); z-index: 60; max-width: calc(100% - 32px); }

@media (max-width: 880px) {
  html, body { height: auto; }
  .app { height: auto; display: block; }
  .leiste { padding-block: 10px; }
  .stand-mini { display: none; }
  .suche { flex-basis: 100%; margin-left: 0; }
  .werkbank { display: block; padding-top: 0; }
  .rad { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--papier); height: 34vh; padding-top: 6px; border-bottom: 1px solid var(--linie); }
  .rad svg#aufriss { height: 100%; max-height: none; }
  .legende { display: none; }
  .karte { overflow: visible; padding: 14px 0 64px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="leiste">
    <h1><a href="#" id="startlink">Kleines Schäferrad</a></h1>
    <div class="stand-mini" id="stand-mini"></div>
    <div class="suche" role="search">
      <input id="suche" type="search" placeholder="Bauteil oder Frage suchen, z. B. Schetter" autocomplete="off" aria-label="Bauteil oder Frage suchen" aria-controls="treffer" aria-expanded="false">
      <ul class="treffer-liste" id="treffer" role="listbox" hidden></ul>
    </div>
  </header>
  <main class="werkbank">
    <section class="rad" aria-label="Das Rad">
      <svg id="aufriss" viewBox="0 0 780 560" role="group" aria-label="Schematischer Aufriss des Kleinen Schäferrads. Jedes Teil lässt sich anwählen."></svg>
      <div class="etikett" id="etikett" hidden></div>
      <ul class="legende" aria-label="Legende">
        <li><svg viewBox="0 0 22 12"><rect x="1" y="1" width="20" height="10" fill="var(--holz)" stroke="var(--tinte)"/></svg>beschrieben</li>
        <li><svg viewBox="0 0 22 12"><rect x="1" y="1" width="20" height="10" fill="none" stroke="var(--leise)" stroke-dasharray="4 3"/></svg>noch unbekannt</li>
        <li><svg viewBox="0 0 22 12"><rect x="1" y="1" width="20" height="10" fill="color-mix(in srgb, var(--eiche) 32%, var(--holz))" stroke="var(--tinte)"/></svg>bestätigt</li>
        <li><svg viewBox="0 0 22 12"><circle cx="11" cy="6" r="5" fill="var(--roetel)"/></svg>offene Fragen</li>
        <li>Schema, nicht maßstäblich. Land rechts.</li>
      </ul>
    </section>
    <section class="karte" id="karte" aria-live="polite"></section>
  </main>
</div>
<div class="bildfenster" id="bildfenster" hidden role="dialog" aria-modal="true" aria-label="Foto"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const K = /*__DATEN__*/null;
const REPO = "https://github.com/jdistlr/kleines-schaeferrad/blob/main/";
const $ = (s, el = document) => el.querySelector(s);

  const foto = fotosZuFrage(f)[0], frei = freischaltet(f.id).length;
  const meta = [vorname(f.entscheidet) && `${vorname(f.entscheidet)} entscheidet`, frei && `Schaltet ${frei} weitere ${frei === 1 ? "Frage" : "Fragen"} frei`, f.haengt_ab_von.length && "Wartet auf eine andere Antwort"].filter(Boolean).join(". ");
  return `<button class="fragekarte${foto ? "" : " ohne-bild"}" data-gehe="${f.id}">${foto ? `<img src="${bildSrc(foto)}" alt="" loading="lazy">` : ""}<div><b>${esc(f.frage)}</b><span>${esc(meta)}${meta ? "." : ""}</span></div></button>`;
}
const fragezeile = f => `<button class="fragezeile" data-gehe="${f.id}"><b>${esc(kurz(f.frage, 140))}</b><span>${vorname(f.entscheidet) ? esc(vorname(f.entscheidet)) + " entscheidet" : ""}</span></button>`;

function start() {
  const reihe = nach(offen.filter(f => !altLuecke(f)), gewicht);
  const zuerst = reihe.slice(0, 3), rest = reihe.slice(3), alt = offen.filter(altLuecke);
  const gruppeVon = f => { const t = [...f.betrifft, ...f.blockiert].flatMap(bezugVon).find(x => teile[x]); const v = t ? [...vorfahren(t), t] : []; return v.includes("COMP-WHEEL") ? "Wasserrad" : v.includes("COMP-RADSTATT") ? "Radstadt" : v.includes("COMP-WATERWAY") ? "Wasserführung" : "Allgemein"; };
  const gruppiert = {}; rest.forEach(f => (gruppiert[gruppeVon(f)] ||= []).push(f));
  const mitSpur = nach(offen.filter(f => teileHinweis(f.hinweis).spuren.length), gewicht);
  karte.innerHTML = `
    <p class="einstieg">Tippe ein Teil am Rad an, um zu sehen, was darüber bekannt ist. Oder beginne mit den Fragen, deren Antwort am meisten weiterhilft.</p>
    <div class="wissen">
      <div class="balken" role="img" aria-label="${best} bestätigt, ${off} offen, ${unterlage} aus allgemeinen Unterlagen">${balken}</div>
      <dl><div><dt>bestätigt</dt><dd>${best}</dd></div><div><dt>noch offen</dt><dd>${off}</dd></div><div><dt>Messfotos ausgewertet</dt><dd>${messAus}<span> / ${messfotos.length}</span></dd></div></dl>
      <p class="leise">Das Rad wurde am 10. Oktober 2026 abgebaut. Bis zum Aufbau im Frühjahr liegen alle Teile einzeln im Lager.</p>
    </div>
    ${auftraege().length ? `<button class="messliste-knopf" data-gehe="messliste"><b>Messliste für den nächsten Gang ins Lager</b><span>${erledigtZahl()} / ${auftraege().length} erledigt</span></button>` : ""}
    ${mitSpur.length ? `<h3>Neue Spuren<small>${mitSpur.length}</small></h3><p class="leise klein">Was die Auswertung der Abbau-Fotos zu offenen Fragen ergeben hat. Entschieden ist damit noch nichts.</p>${mitSpur.map(f => { const sp = teileHinweis(f.hinweis).spuren.at(-1); return `<button class="spurkarte" data-gehe="${f.id}"><b>${esc(kurz(f.frage, 120))}</b><span>${esc(kurz(sp.text, 210))}</span></button>`; }).join("")}` : ""}
    <h3>Als Nächstes klären</h3>
    ${zuerst.map(fragekarte).join("")}
    ${FIGUREN.length ? `<h3>Figuren<small>${FIGUREN.length}</small></h3><p class="leise klein">Gezeichnet aus den Maßen im Wissenskern. Was offen ist, steht in der Bildunterschrift.</p>${figurKacheln(FIGUREN)}` : ""}
    <h3>Weitere offene Fragen<small>${rest.length}</small></h3>
    ${["Wasserrad", "Radstadt", "Wasserführung", "Allgemein"].filter(g => gruppiert[g]).map(g => `<details class="gruppe"><summary>${g}<small>${gruppiert[g].length}</small></summary><div class="innen">${gruppiert[g].map(fragezeile).join("")}</div></details>`).join("")}
    ${alt.length ? `<details class="gruppe"><summary>Aus der Zeit vor dem Abbau<small>${alt.length}</small></summary><div class="innen"><p class="leise klein">Aufnahmewünsche von vor dem Abbau. Prüfen, ob die Fotos vom Abbau sie schon beantworten, sonst beim Aufbau im Frühjahr nachholen.</p>${alt.map(fragezeile).join("")}</div></details>` : ""}
    ${fuss()}`;
}
const neuSeitAbbau = K.angaben.filter(a => /^AN-2026101[1-9]/.test(a.id)).length;
const fuss = () => `<p class="fuss">Erzeugt aus dem Wissenskern${K.commit ? ", Stand " + esc(K.commit) : ""}. ${S.angaben} Angaben, davon ${neuSeitAbbau} seit dem Abbau neu; ${K.quellen.length} Quellen; ${offen.length} offene Fragen. Fachlich gültig ist erst, was Thorsten bestätigt.</p>`;

const FIGUREN = K.figuren || [];
function figurKacheln(liste) {
  return liste.map(f => `<button class="figurkachel" data-figur="${f.id}"><b>${esc(f.titel)}</b><span>${esc(f.beschreibung)}</span></button>`).join("");
}
function oeffneFigur(id) {
  const fig = FIGUREN.find(f => f.id === id), f = $("#bildfenster"), vorher = document.activeElement;
  const dunkel = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  f.innerHTML = `<button aria-label="Schließen" id="bild-zu">×</button><iframe src="figuren/${fig.id}${dunkel ? "" : "-hell"}.html" title="${esc(fig.titel)}"></iframe>`;
  f.setAttribute("aria-label", fig.titel);
  f.hidden = false; $("#bild-zu").focus();
  const taste = e => { if (e.key === "Escape") zu(); };
  const zu = () => { f.hidden = true; f.innerHTML = ""; f.setAttribute("aria-label", "Foto"); document.removeEventListener("keydown", taste); vorher?.focus?.(); };
  $("#bild-zu").onclick = zu; f.onclick = e => { if (e.target === f) zu(); }; document.addEventListener("keydown", taste);
}

function fotostreifen(liste, max = 18) {
  if (!liste.length) return `<p class="leer-text">Noch keine Fotos zugeordnet.</p>`;
  return `<div class="fotos">${liste.slice(0, max).map(q => `<button data-foto="${q.id}" aria-label="Foto öffnen"><img src="${bildSrc(q)}" alt="" loading="lazy"><span class="art">${esc(BILDART[q.bildart] || (q.art === "skizze" ? "Skizze" : "Foto"))}</span></button>`).join("")}</div>${liste.length > max ? `<p class="leer-text">und ${liste.length - max} weitere</p>` : ""}`;
}

function angabenTabelle(liste, id) {
  const reihen = ["messung", "muendlich", "skizze", "foto", "ableitung", "annahme", "scan", "kontext", "holzliste", "fremdvorlage"];
  const bez = a => beziehungen[a.ziel] ? `${teile[beziehungen[a.ziel].von]?.name || ""} ${begriffe[beziehungen[a.ziel].art]?.name || ""} ${teile[beziehungen[a.ziel].zu]?.name || ""}` : a.ziel !== id && teile[a.ziel] ? teile[a.ziel].name : "";
  const z = a => `<tr><td>${esc(eig(a.eig))}${bez(a) ? `<div class="bezug">${esc(bez(a))}</div>` : ""}</td><td class="wert">${esc(wertText(a))}${belege(a, 3)}</td><td><span class="status ${a.guelt}">${GUELT[a.guelt]}</span></td></tr>`;
  return `<table class="angaben"><tbody>${reihen.filter(g => liste.some(a => a.grund === g)).map(g => `<tr class="gruppe"><td colspan="3">${GRUND_LANG[g]}</td></tr>` + liste.filter(a => a.grund === g).map(z).join("")).join("")}</tbody></table>`;
}

function antwortBereich(ziel, art) {
  const liste = Speicher.zu(ziel);
  const vorhanden = liste.length ? liste.map(a => `<div class="antwort"><header><b>${esc(Speicher.name(a))}</b><span>${new Date(a.am).toLocaleString("de-DE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span><span class="marker-art${a.typ === "stimmt_nicht" ? " nein" : ""}">${esc(TYPEN[a.typ] || a.typ || "")}</span>${a.uebernommen ? `<span class="status bestaetigt">im Wissenskern</span>` : ""}</header>${a.wert ? `<p><b>${esc(a.wert)}</b></p>` : ""}${a.text ? `<p>${esc(a.text)}</p>` : ""}</div>`).join("") : "";
  if (Speicher.modus === "lesen") return vorhanden + `<p class="nurlesen">Antworten und Ergänzungen gibt man in der Arbeitsfassung des Cockpits. Diese Seite ist zum Lesen.</p>`;
  const wahl = art === "frage" ? ["stimmt", "stimmt_nicht", "genauer"] : ["ergaenzung", "korrektur"];
  return vorhanden + `<form class="formular" id="antwort-form" data-ziel="${esc(ziel)}">
    <div class="wahl" role="group" aria-label="Art der Antwort">${wahl.map((w, i) => `<button type="button" data-typ="${w}" aria-pressed="${i === 0}">${TYPEN[w]}</button>`).join("")}</div>
    <label for="antwort-text">${art === "frage" ? "Was weißt du dazu?" : "Was möchtest du ergänzen?"}<textarea id="antwort-text" placeholder="${art === "frage" ? "Zum Beispiel: gemessen an der Innenkante, auf Höhe der Achse" : "Zum Beispiel: Die Keile werden von oben eingetrieben"}"></textarea></label>
    <div class="reihe"><label for="antwort-wert">Wert, falls es ein Maß ist<input id="antwort-wert" placeholder="z. B. 4,40 m"></label>${Speicher.modus === "server" ? `<label for="antwort-name">Dein Name<input id="antwort-name" autocomplete="name"></label>` : ""}</div>
    <div class="reihe"><button class="knopf" type="submit">Antwort speichern</button><span class="leise" style="font-size:var(--m1)">Johannes übernimmt Antworten in den Wissenskern, Thorsten bestätigt sie.</span></div>
  </form>`;
}

function bauteil(id) {
  const b = teile[id], beg = begriffe[b.begriff];
  const ang = sammle(angabenJe, id), anzBest = ang.filter(a => a.guelt === "bestaetigt").length;
  const masse = nach((direktJe[id] || []).filter(a => istMass(a) && !["holzliste", "fremdvorlage", "scan"].includes(a.grund) && a.guelt !== "ueberholt"), a => ({ messung: 5, muendlich: 4, skizze: 3, foto: 2, ableitung: 1 }[a.grund] || 0)).filter((a, i, l) => l.findIndex(b => b.eig.replace(/_skizze$/, "") === a.eig.replace(/_skizze$/, "")) === i).slice(0, 6);
  const fr = nach(sammle(fragenJe, id).filter(f => !altLuecke(f)), gewicht);
  const fotos = fotosVon([id]);
  const unter = (kinder[id] || []).map(k => teile[k]);
  const pfadK = vorfahren(id);
  karte.innerHTML = `
    <button class="zurueck" data-gehe="">Zurück zum Überblick</button>
    ${pfadK.length ? `<p class="pfad">${pfadK.map(k => `<a href="#${k}" data-gehe="${k}">${esc(teile[k].name)}</a>`).join(" / ")}</p>` : ""}
    <h2>${esc(b.name)}</h2>
    ${beg && !["B-VORLAGE", "B-HOLZLISTENPOSTEN"].includes(beg.id) ? `<p class="definition">${esc(beg.definition)}</p>` : ""}
    ${beg?.aliase?.length ? `<p class="auch">Im Verein auch: ${beg.aliase.map(esc).join(", ")}</p>` : ""}
    ${b.anzahl ? `<p class="auch">Anzahl: ${esc(b.anzahl)}</p>` : ""}
    ${b.hinweis ? `<p class="hinweis">${esc(b.hinweis)}</p>` : ""}
    ${FIGUREN.some(x => x.bauteile.includes(id)) ? `<h3>Figur</h3>${figurKacheln(FIGUREN.filter(x => x.bauteile.includes(id)))}` : ""}
    <h3>Wichtigste Maße</h3>
    ${masse.length ? `<dl class="masse">${masse.map(a => `<div><dt>${esc(eig(a.eig))}</dt><dd>${esc(wertText(a))}<small>${GRUND[a.grund]}, ${a.guelt === "bestaetigt" ? "bestätigt" : "noch offen"}</small>${abgleich(a, direktJe[id] || [])}${belege(a)}</dd></div>`).join("")}</dl>` : `<p class="leer-text">Noch keine Maße für dieses Teil.</p>`}
    ${fr.length ? `<h3>Offen<small>${fr.length}</small></h3>${fr.slice(0, 3).map(fragekarte).join("")}${fr.length > 3 ? `<details class="gruppe" style="margin-top:10px"><summary>Weitere Fragen zu diesem Teil<small>${fr.length - 3}</small></summary><div class="innen">${fr.slice(3).map(fragezeile).join("")}</div></details>` : ""}` : ""}
    <h3>Fotos<small>${fotos.length}</small></h3>${fotostreifen(fotos)}
    ${unter.length ? `<h3>Besteht aus</h3><div class="chips">${unter.map(k => `<button data-gehe="${k.id}">${esc(k.name)}</button>`).join("")}</div>` : ""}
    <h3>Ergänzen</h3>${antwortBereich(id, "bauteil")}
    ${ang.length ? `<details class="alle"><summary>Alle ${ang.length} Angaben anzeigen, ${anzBest ? anzBest + " bestätigt" : "keine bestätigt"}</summary>${angabenTabelle(ang, id)}</details>` : ""}`;
}

function frage(id) {
  const f = fragen[id];
  const frei = freischaltet(id).map(x => fragen[x]), warte = f.haengt_ab_von.map(x => fragen[x]);
  const bez = [...new Set([...f.betrifft, ...f.blockiert].flatMap(bezugVon))].filter(t => teile[t]);
  const { alt: hinweisAlt, spuren } = teileHinweis(f.hinweis);
  const bekannt = [...new Set([...f.betrifft.map(x => angabenById[x]).filter(Boolean), ...genannteAngabenVoll(f.hinweis)])];
  karte.innerHTML = `
    <button class="zurueck" data-gehe="">Zurück zum Überblick</button>
    <p class="pfad">${vorname(f.entscheidet) ? esc(vorname(f.entscheidet)) + " entscheidet" : "Offene Frage"}</p>
    <h2 class="frage-titel">${esc(f.frage)}</h2>
    ${spuren.map(sp => `<div class="spur"><b>Neue Spur${sp.datum ? " · " + esc(sp.datum) : ""}</b>${esc(sp.text)}</div>`).join("")}
    ${auftragVon(f.hinweis) ? `<div class="auftrag"><b>Messauftrag · ${esc(auftragVon(f.hinweis).datum)}</b>${esc(auftragVon(f.hinweis).text)} <a href="#messliste" data-gehe="messliste">Zur Messliste</a></div>` : ""}
    ${hinweisAlt ? `<p class="hinweis">${esc(hinweisAlt)}</p>` : ""}
    ${frei.length || warte.length ? `<h3>Warum sie wichtig ist</h3>` : ""}
    ${frei.length ? `<p class="leise klein">Die Antwort macht diese Fragen beantwortbar:</p>${frei.map(fragezeile).join("")}` : ""}
    ${warte.length ? `<p class="leise klein" style="margin-top:14px">Leichter, wenn zuerst diese geklärt ist:</p>${warte.map(fragezeile).join("")}` : ""}
    ${bekannt.length ? `<h3>Bisheriger Stand</h3><dl class="masse">${bekannt.map(a => `<div><dt>${esc(eig(a.eig))}</dt><dd>${esc(wertText(a))}<small>${GRUND[a.grund]}, ${GUELT[a.guelt]} · ${esc(a.id)}</small>${belege(a)}</dd></div>`).join("")}</dl>` : ""}
    ${FIGUREN.some(x => x.fragen.includes(id)) ? `<h3>Figur</h3>${figurKacheln(FIGUREN.filter(x => x.fragen.includes(id)))}` : ""}
    ${bez.length ? `<h3>Betrifft</h3><div class="chips">${bez.map(t => `<button data-gehe="${t}">${esc(teile[t].name)}</button>`).join("")}</div>` : ""}
    <h3>Passende Fotos</h3>${fotostreifen(fotosZuFrage(f), 14)}
    <h3>Antworten</h3>${antwortBereich(id, "frage")}`;
}

// ---------- Messliste ----------
const auftraege = () => nach(offen.filter(f => auftragVon(f.hinweis)), f => (teileHinweis(f.hinweis).spuren.length ? 100 : 0) + gewicht(f));
const HAKEN = "ks-messliste";
const haken = () => { try { return JSON.parse(localStorage.getItem(HAKEN) || "{}"); } catch { return {}; } };
const setzeHaken = (id, an) => { try { const h = haken(); if (an) h[id] = true; else delete h[id]; localStorage.setItem(HAKEN, JSON.stringify(h)); } catch {} };
const erledigtZahl = () => { const h = haken(); return auftraege().filter(f => h[f.id]).length; };
function messliste() {
  const h = haken();
  karte.innerHTML = `
    <button class="zurueck" data-gehe="">Zurück zum Überblick</button>
    <p class="pfad">Für Thorsten und alle, die ins Lager oder an die Radstadt gehen</p>
    <h2>Messliste</h2>
    <p class="leise klein" style="margin-top:8px">Jeder Posten beantwortet eine offene Frage. Bitte zu jedem Maß ein Foto mit angelegtem Zollstock machen und sagen, wo der Nullpunkt liegt. Das Abhaken merkt sich nur dieses Gerät. Ergebnisse trägt man in der Frage unter „Antworten“ ein.</p>
    ${auftraege().map((f, i) => { const a = auftragVon(f.hinweis), fotos = fotosZuFrage(f).slice(0, 3); return `<div class="posten${h[f.id] ? " erledigt" : ""}"><input type="checkbox" data-haken="${f.id}" ${h[f.id] ? "checked" : ""} aria-label="Posten ${i + 1} erledigt"><div><h4><a href="#${f.id}" data-gehe="${f.id}">${i + 1}. ${esc(f.frage)}</a></h4><p>${esc(a.text)}</p>${fotos.length ? `<div class="fotos" style="margin-top:8px">${fotos.map(q => `<button data-foto="${q.id}" aria-label="Foto öffnen"><img src="${bildSrc(q)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}</div></div>`; }).join("")}
    <p class="knopf-zeile" style="margin-top:18px"><button class="knopf" type="button" onclick="print()">Drucken</button></p>
    ${fuss()}`;
}
document.addEventListener("change", e => { const c = e.target.closest("[data-haken]"); if (!c) return; setzeHaken(c.dataset.haken, c.checked); c.closest(".posten").classList.toggle("erledigt", c.checked); });

// ---------- Navigation ----------
let aktuell = null;
function zeige({ neu = true } = {}) {
  const z = decodeURIComponent(location.hash.slice(1));
  const ziel = teile[z] || fragen[z] || z === "messliste" ? z : "";
  const gewechselt = ziel !== aktuell; aktuell = ziel;
  const markiert = teile[ziel] ? unterteile(ziel) : fragen[ziel] ? [...new Set([...fragen[ziel].betrifft, ...fragen[ziel].blockiert].flatMap(bezugVon))] : [];
  Object.entries(gruppen).forEach(([k, g]) => g.classList.toggle("gewaehlt", markiert.includes(k)));
  const scroll = karte.scrollTop;
  if (teile[ziel]) bauteil(ziel); else if (fragen[ziel]) frage(ziel); else if (ziel === "messliste") messliste(); else start();
  if (gewechselt && neu) { karte.scrollTop = 0; if (ziel && matchMedia("(max-width: 880px)").matches) window.scrollTo({ top: karte.offsetTop - $(".rad").offsetHeight - 8 }); }
  else karte.scrollTop = scroll;
  document.title = (teile[ziel]?.name || (fragen[ziel] ? "Offene Frage" : ziel === "messliste" ? "Messliste" : "")) + (ziel ? " – " : "") + "Kleines Schäferrad";
}
function gehe(id) { if (decodeURIComponent(location.hash.slice(1)) === id) zeige(); else location.hash = id; }
window.addEventListener("hashchange", () => zeige());
$("#startlink").addEventListener("click", e => { e.preventDefault(); gehe(""); });
document.addEventListener("click", e => {
  const g = e.target.closest("[data-gehe]"); if (g) { e.preventDefault(); gehe(g.dataset.gehe); return; }
  const f = e.target.closest("[data-foto]"); if (f) { oeffneFoto(f.dataset.foto, f.dataset.angabe, f.dataset.stelle); return; }
  const fg = e.target.closest("[data-figur]"); if (fg) { oeffneFigur(fg.dataset.figur); return; }
  const w = e.target.closest(".wahl button"); if (w) w.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === w ? "true" : "false"));
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "antwort-form") return;
  e.preventDefault();
  const fm = e.target, text = $("#antwort-text").value.trim(), wert = $("#antwort-wert").value.trim();
  const typ = fm.querySelector(".wahl [aria-pressed=true]")?.dataset.typ;
  if (!text && !wert && typ !== "stimmt") { $("#antwort-text").focus(); toast("Bitte kurz beschreiben, was du weißt."); return; }
  const knopf = fm.querySelector(".knopf"); knopf.disabled = true;
  try {
    await Speicher.speichern({ ziel: fm.dataset.ziel, typ, text, wert, ...(Speicher.modus === "server" ? { name: $("#antwort-name")?.value.trim() || "" } : {}) });
    toast("Antwort gespeichert");
  } catch { toast("Speichern hat nicht geklappt. Bitte später noch einmal versuchen."); knopf.disabled = false; }
});
Speicher.hoerer.push(() => { if (!document.activeElement?.closest("#antwort-form")) zeige({ neu: false }); });

function oeffneFoto(id, angabe, stelle) {
  const q = quellen[id], f = $("#bildfenster"), vorher = document.activeElement, an = angabenById[angabe];
  const gross = K.bilderPaket ? bildSrc(q) : q.bild;
  f.innerHTML = `<button aria-label="Schließen" id="bild-zu">×</button><figure><img src="${gross}" alt=""><figcaption>${an ? `<span class="abgelesen">${esc(eig(an.eig))}: ${esc(wertText(an))}${stelle ? " – abgelesen: " + esc(stelle) : ""}</span>` : ""}<span>${esc(BILDART[q.bildart] || (q.art === "skizze" ? "Skizze" : "Foto"))}${q.bauteil && teile[q.bauteil] ? ", " + esc(teile[q.bauteil].name) : ""}</span>${q.pfad ? `<a href="${REPO + encodeURI(q.pfad)}" target="_blank" rel="noopener">Original in voller Größe</a>` : ""}</figcaption></figure>`;
  f.hidden = false; $("#bild-zu").focus();
  const taste = e => { if (e.key === "Escape") zu(); };
  const zu = () => { f.hidden = true; document.removeEventListener("keydown", taste); vorher?.focus?.(); };
  $("#bild-zu").onclick = zu; f.onclick = e => { if (e.target === f) zu(); }; document.addEventListener("keydown", taste);
}
function toast(t) { const n = $("#toast"); n.textContent = t; n.hidden = false; clearTimeout(toast.z); toast.z = setTimeout(() => { n.hidden = true; }, 2600); }

// Suche: kennt Vereinsbegriffe und Schreibvarianten
const index = [
  ...K.bauteile.filter(b => b.art !== "listenposten").map(b => ({ id: b.id, titel: b.name, text: [b.name, ...(begriffe[b.begriff]?.aliase || [])].join(" "), art: "Bauteil" })),
  ...offen.map(f => ({ id: f.id, titel: kurz(f.frage, 90), text: f.frage, art: "Offene Frage" })),
];
const suche = $("#suche"), trefferListe = $("#treffer"); let auswahl = 0, liste = [];
function sucheAus() {
  const w = suche.value.trim().toLowerCase();
  liste = w.length < 2 ? [] : index.map(x => ({ x, p: x.titel.toLowerCase().startsWith(w) ? 3 : x.text.toLowerCase().split(/[\s/,()]+/).some(t => t.startsWith(w)) ? 2 : x.text.toLowerCase().includes(w) ? 1 : 0 }))
    .filter(r => r.p).sort((a, b) => b.p - a.p || (a.x.art === "Bauteil" ? -1 : 1)).slice(0, 8).map(r => r.x);
  auswahl = 0;
  trefferListe.innerHTML = liste.map((x, i) => `<li role="option" aria-selected="${i === 0}" data-gehe="${x.id}">${esc(x.titel)}<small>${x.art}</small></li>`).join("") || (w.length >= 2 ? `<li aria-disabled="true">Nichts gefunden</li>` : "");
  trefferListe.hidden = w.length < 2; suche.setAttribute("aria-expanded", String(!trefferListe.hidden));
}
suche.addEventListener("input", sucheAus);
suche.addEventListener("keydown", e => {
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && liste.length) { e.preventDefault(); auswahl = (auswahl + (e.key === "ArrowDown" ? 1 : -1) + liste.length) % liste.length; trefferListe.querySelectorAll("li").forEach((l, i) => l.setAttribute("aria-selected", String(i === auswahl))); }
  if (e.key === "Enter" && liste[auswahl]) { gehe(liste[auswahl].id); suche.value = ""; sucheAus(); suche.blur(); }
  if (e.key === "Escape") { suche.value = ""; sucheAus(); }
});
trefferListe.addEventListener("click", () => { suche.value = ""; sucheAus(); });
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "")) { e.preventDefault(); suche.focus(); } });
document.addEventListener("click", e => { if (!e.target.closest(".suche")) trefferListe.hidden = true; });

zeige();
Speicher.start();
</script>
