<title>Kleines Schäferrad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Arbeitsplatz: oben eine Leiste, links die Fragenliste, rechts daneben das Gewählte mit Lageplan und Belegen.
   Jede Spalte scrollt für sich. Auf dem Handy: eine Spalte, Radstreifen oben, Leiste unten. */
:root {
  --papier: #edf1ec; --flaeche: #f6f8f5; --tinte: #1c2726; --leise: #5f6d6a; --linie: #c9d1cc;
  --wasser: #2b6a76; --wasser-hauch: #d6e6e8; --roetel: #a5412a; --roetel-hauch: #f3e2dc;
  --eiche: #4f6f2a; --holz: #e2d8c6; --holz-dunkel: #b9a88c; --fluss: #c9dcdc;
  --serif: "Alegreya", "Iowan Old Style", Georgia, serif;
  --sans: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --m1: .8125rem; --m2: .9375rem; --m3: 1.0625rem; --m4: 1.3125rem; --m5: 1.75rem;
  --kopf: 57px; --tabs: 0px; --rand: clamp(18px, 2.6vw, 36px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papier: #121817; --flaeche: #1a2120; --tinte: #dfe6e2; --leise: #9aa8a4; --linie: #33403d;
  --wasser: #86bec7; --wasser-hauch: #20393d; --roetel: #e48c71; --roetel-hauch: #3a2520; --eiche: #a9c77a;
  --holz: #3a352b; --holz-dunkel: #6f6450; --fluss: #1d3033; color-scheme: dark; } }
:root[data-theme="dark"] {
  --papier: #121817; --flaeche: #1a2120; --tinte: #dfe6e2; --leise: #9aa8a4; --linie: #33403d;
  --wasser: #86bec7; --wasser-hauch: #20393d; --roetel: #e48c71; --roetel-hauch: #3a2520; --eiche: #a9c77a;
  --holz: #3a352b; --holz-dunkel: #6f6450; --fluss: #1d3033; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--papier); color: var(--tinte); font: 400 var(--m3)/1.5 var(--sans); margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--wasser); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--wasser); outline-offset: 2px; border-radius: 3px; }
.leise { color: var(--leise); }
.zahl { font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- Leiste ---------- */
.leiste { display: flex; align-items: center; gap: 8px 18px; padding: 10px var(--rand); border-bottom: 1px solid var(--linie); background: var(--papier); }
.leiste h1 { font: 700 var(--m4)/1 var(--serif); margin: 0 6px 0 0; white-space: nowrap; }
.leiste h1 a { color: inherit; text-decoration: none; }
.zaehler { display: flex; gap: 2px; flex-wrap: wrap; }
.zaehler > * { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--tinte); font-size: var(--m2); text-decoration: none; white-space: nowrap; }
.zaehler > *:hover { background: var(--flaeche); }
.zaehler b { font: 700 var(--m3)/1 var(--sans); font-variant-numeric: tabular-nums; }
.zaehler .neu b { color: var(--wasser); }
.zaehler .mess b { color: var(--roetel); }
.vorgehen-link { font-size: var(--m2); white-space: nowrap; }
.suche { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 180px; }
.suche input { width: 100%; padding: 7px 12px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); }
.suche input::placeholder { color: var(--leise); }
.treffer-liste { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); max-height: 60vh; overflow: auto; }
.treffer-liste li { padding: 7px 10px; border-radius: 4px; cursor: pointer; }
.treffer-liste li[aria-selected="true"], .treffer-liste li:hover { background: var(--wasser-hauch); }
.treffer-liste small { display: block; color: var(--leise); font-size: var(--m1); }

/* ---------- Arbeitsplatz ---------- */
.arbeitsplatz { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
.liste { min-height: 0; overflow-y: auto; border-right: 1px solid var(--linie); padding: 14px 0 48px; overscroll-behavior: contain; }
.filter { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 14px 4px; }
.filter button { border: 1px solid var(--linie); background: none; border-radius: 999px; padding: 1px 8px; font-size: var(--m1); cursor: pointer; color: var(--leise); }
.filter button:hover { border-color: var(--wasser); color: var(--wasser); }
.filter button[aria-pressed="true"] { background: var(--tinte); border-color: var(--tinte); color: var(--papier); }
.liste h2 { font: 600 11px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--leise); margin: 16px 16px 6px; display: flex; justify-content: space-between; }
.zeile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 7px 16px 7px 13px; cursor: pointer; color: var(--tinte); }
.zeile:hover { background: var(--flaeche); }
.zeile[aria-current="true"] { background: var(--wasser-hauch); border-left-color: var(--wasser); }
.zeile b { font-weight: 500; font-size: var(--m2); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zeile .meta { grid-column: 1; font-size: var(--m1); line-height: 1.35; color: var(--leise); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zeile .rechts { grid-row: 1 / span 2; grid-column: 2; align-self: center; display: flex; gap: 6px; align-items: center; font-size: var(--m1); color: var(--leise); font-variant-numeric: tabular-nums; }
.zeile.ruht b { font-weight: 400; color: var(--leise); }
.zeile.im-text { border-left: 0; border-top: 1px solid var(--linie); padding: 8px 2px; }
.zeile.im-text:last-child { border-bottom: 1px solid var(--linie); }
.punkt { width: 7px; height: 7px; border-radius: 50%; background: var(--wasser); display: inline-block; flex: none; }
.sprechblase { display: inline-flex; align-items: center; gap: 3px; }
.sprechblase svg { width: 13px; height: 13px; }
.leer-liste { padding: 8px 16px; font-size: var(--m2); color: var(--leise); }

.inhalt { min-height: 0; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr) 336px; align-items: start; overscroll-behavior: contain; }
.inhalt.ohne-kontext { grid-template-columns: minmax(0, 1fr); }
.inhalt.ohne-kontext .kontext { display: none; }
.mitte { min-width: 0; padding: 24px var(--rand) 0; }
.mitte > .breite { max-width: 760px; }
.kontext { position: sticky; top: 0; max-height: calc(100dvh - var(--kopf)); overflow-y: auto; padding: 20px 20px 48px; border-left: 1px solid var(--linie); }
#rad-streifen { display: none; }

/* ---------- Rad ---------- */
.lageplan { position: relative; }
.lageplan svg { width: 100%; height: auto; display: block; }
.lageplan.mini { margin-bottom: 6px; }
.lageplan.mini .marke, .lageplan.streifen .marke { display: none; }
#rad-gross .lageplan svg { max-height: calc(100dvh - var(--kopf) - 190px); }
.etikett { position: absolute; pointer-events: none; background: var(--tinte); color: var(--papier); font-size: var(--m2); padding: 3px 9px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 5; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; list-style: none; font-size: var(--m1); color: var(--leise); }
.legende li { display: flex; align-items: center; gap: 6px; }
.legende svg { width: 22px; height: 12px; }
svg .teil { cursor: pointer; }
svg .teil .form { fill: var(--holz); stroke: var(--tinte); stroke-width: 1.3; transition: fill .15s; }
svg .teil .treffer { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; }
svg .teil.leer .form { fill: none; stroke-dasharray: 4 3; stroke: var(--leise); }
svg .teil.bestaetigt .form { fill: color-mix(in srgb, var(--eiche) 32%, var(--holz)); }
svg .teil:hover .form, svg .teil:focus-visible .form { fill: var(--wasser-hauch); }
svg .teil.gewaehlt .form { stroke: var(--wasser); stroke-width: 2.4; fill: var(--wasser-hauch); }
.lageplan.hat-wahl svg .teil:not(.gewaehlt) .form { opacity: .55; }
svg .teil:focus-visible { outline: none; }
svg .marke circle { fill: var(--roetel); stroke: var(--papier); stroke-width: 2; }
svg .marke text { fill: #fff; font: 700 12px var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
svg .fluss { fill: var(--fluss); }
svg .welle { fill: none; stroke: var(--wasser); stroke-width: 1; opacity: .7; }
svg .gelaende { fill: none; stroke: var(--leise); stroke-width: 1.2; }
svg .schraffur { stroke: var(--linie); stroke-width: 1; }
svg .wasserweg { fill: none; stroke: var(--wasser); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }

/* ---------- Inhalt ---------- */
.augenbraue { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 8px; font-size: var(--m1); color: var(--leise); }
.augenbraue a { color: var(--leise); }
.augenbraue .id { font: 600 var(--m1) ui-monospace, "SF Mono", Menlo, monospace; color: var(--tinte); letter-spacing: .02em; }
.kl { display: inline-block; padding: 0 8px; border-radius: 999px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--tinte); }
.kl.aufbau { color: var(--leise); border-style: dashed; background: none; }
.neu-marke { display: inline-flex; align-items: center; gap: 5px; color: var(--wasser); font-weight: 500; }
.mitte h2 { font: 700 var(--m5)/1.15 var(--serif); margin: 0; text-wrap: balance; }
.wortlaut { margin: 8px 0 0; color: var(--leise); max-width: 68ch; }
.einstieg { font: 400 var(--m4)/1.35 var(--serif); margin: 14px 0 0; max-width: 46ch; }
.kennzeile { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 10px 0 0; font-size: var(--m2); color: var(--leise); }
.kennzeile b { color: var(--tinte); font-weight: 500; font-variant-numeric: tabular-nums; }

.notiz { margin: 18px 0 0; padding: 1px 0 1px 14px; border-left: 3px solid var(--wasser); max-width: 68ch; }
.notiz > b { display: block; font: 600 11px/1.5 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--wasser); }
.notiz p { margin: 3px 0 0; }
.notiz.auftrag { border-left-color: var(--roetel); }
.notiz.auftrag > b { color: var(--roetel); }
.notiz.herleitung { border-left-color: var(--holz-dunkel); }
.notiz.herleitung > b { color: var(--leise); }
.klemme { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.klemme.offen { display: block; }
.knopf-leise { background: none; border: 0; padding: 4px 0 0; color: var(--wasser); cursor: pointer; font-size: var(--m2); }

.abschnitt { margin-top: 30px; }
.abschnitt > h3, .kontext h3, .kontext-unten h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font: 600 11px/1.2 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--leise); }
.abschnitt > h3 small, .kontext h3 small, .kontext-unten h3 small { font: 400 var(--m1) var(--sans); letter-spacing: 0; text-transform: none; }
.kontext h3, .kontext-unten h3 { margin-top: 22px; }
.kontext-unten { margin-top: 32px; padding-top: 4px; border-top: 1px solid var(--linie); }
.kontext-unten .belegraster { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.kontext-unten .belegraster button.gross { grid-column: span 2; }
.kontext h3:first-child { margin-top: 0; }
.abschnitt p.klein, .kontext p.klein, .kontext-unten p.klein, .breite > p.klein { margin: 0 0 8px; font-size: var(--m2); color: var(--leise); }
.leer-text { color: var(--leise); font-size: var(--m2); margin: 0; }

table.stueck { width: 100%; border-collapse: collapse; font-size: var(--m2); }
.stueck td { padding: 8px 14px 8px 0; border-top: 1px solid var(--linie); vertical-align: top; }
.stueck tr:last-child td { border-bottom: 1px solid var(--linie); }
.stueck td:last-child { padding-right: 0; }
.stueck .mass { width: 38%; }
.stueck .mass small { display: block; color: var(--leise); font-size: var(--m1); }
.stueck .wert { min-width: 130px; font: 500 var(--m3)/1.3 var(--serif); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stueck .wert.text { font: 400 var(--m2)/1.45 var(--sans); }
.stueck .herkunft { font-size: var(--m1); color: var(--leise); white-space: nowrap; }
.stueck .herkunft.bestaetigt { color: var(--eiche); font-weight: 500; }
.stueck .belege { margin-top: 0; flex-wrap: nowrap; }
.stueck .belege img { width: 34px; height: 34px; }

.belege { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.belege button { padding: 0; border: 1px solid var(--linie); background: var(--linie); border-radius: 4px; cursor: pointer; line-height: 0; }
.belege button:hover { border-color: var(--wasser); }
.belege img { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; display: block; }
.zitat-knopf { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 1px 9px 1px 7px; font-size: var(--m1); color: var(--wasser); cursor: pointer; white-space: nowrap; }
.zitat-knopf:hover { border-color: var(--wasser); }
.belege .zitat-knopf { line-height: 1.5; background: var(--flaeche); border-color: var(--linie); border-radius: 999px; padding: 1px 9px 1px 7px; }
.zitat-knopf svg { width: 11px; height: 11px; }
.stueck td.ok { white-space: nowrap; padding-right: 0; text-align: right; }
.pruef { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 3px 12px; font-size: var(--m1); font-weight: 500; color: var(--wasser); cursor: pointer; white-space: nowrap; }
.pruef:hover { border-color: var(--wasser); }
.pruef.direkt { color: var(--eiche); }
.pruef.direkt:hover { border-color: var(--eiche); }
.pruef.direkt[aria-pressed="true"], .knopf-klein[aria-pressed="true"] { background: var(--eiche); border-color: var(--eiche); color: var(--papier); }
.stimme-zeile { display: block; margin-top: 2px; }
.stimme-zeile .ja { color: var(--eiche); font-weight: 500; }
.stimme-zeile .nein { color: var(--roetel); font-weight: 500; }
.anmeldung-leiste { display: flex; align-items: center; gap: 10px; font-size: var(--m2); white-space: nowrap; }
.anmeldung-leiste .knopf-leise { padding: 0; color: var(--leise); }
.anmeldung-leiste .knopf-leise:hover { color: var(--wasser); }
.anmeldung-leiste .ich { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.punkt.gruen { background: var(--eiche); }
.erklaerung { margin: 8px 0 0; font-size: var(--m1); color: var(--leise); }
.zitatkarte { width: min(560px, 100%); max-height: 86vh; overflow-y: auto; background: var(--papier); color: var(--tinte); border-radius: 10px; padding: 22px 24px; box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
.zitatkarte h3 { font: 700 var(--m4)/1.25 var(--serif); margin: 0; }
.zitatkarte blockquote, .protokoll blockquote { margin: 14px 0 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--holz-dunkel); font: italic 400 var(--m3)/1.5 var(--serif); }
.zitatkarte .eingetragen { margin: 14px 0 0; font-size: var(--m2); }
.zitatkarte .knopfreihe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 0; }
.zitatkarte .knopfreihe .knopf-leise { margin-right: auto; padding: 0; }
.knopf-klein { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 5px 13px; cursor: pointer; font-weight: 500; }
.knopf-klein:hover { border-color: var(--wasser); color: var(--wasser); }
.formular-karte { display: grid; gap: 10px; }
.formular-karte h3 { margin-top: -4px; }
.formular-karte label { font-size: var(--m2); color: var(--leise); display: grid; gap: 4px; }
.formular-karte textarea, .formular-karte input:not(.fangfeld) { width: 100%; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); color: var(--tinte); }
.formular-karte textarea { min-height: 70px; resize: vertical; }
.protokoll table.angaben { margin-top: 10px; }
.belege .text { font: 400 var(--m1)/1.3 var(--sans); color: var(--wasser); text-decoration: none; }
.belege .mehr { font: 400 var(--m1) var(--sans); color: var(--leise); }
.abgleich { display: block; font: 400 var(--m1) var(--sans); margin-top: 3px; }
.abgleich.gleich { color: var(--eiche); }
.abgleich.anders { color: var(--roetel); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 2px 11px; font-size: var(--m2); cursor: pointer; }
.chips button:hover { border-color: var(--wasser); color: var(--wasser); }

.belegraster { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.belegraster button { position: relative; padding: 0; border: 0; background: var(--linie); border-radius: 6px; overflow: hidden; aspect-ratio: 1; cursor: pointer; }
.belegraster button.gross { grid-column: 1 / -1; aspect-ratio: 4 / 3; }
.belegraster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.belegraster .art { position: absolute; left: 6px; bottom: 6px; background: rgb(0 0 0 / .62); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; }

.spurzeile, .figurzeile { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--linie); padding: 10px 0; cursor: pointer; color: inherit; }
.spurzeile:last-of-type, .figurzeile:last-of-type { border-bottom: 1px solid var(--linie); }
.spurzeile b, .figurzeile b { display: flex; align-items: center; gap: 7px; font-weight: 500; font-size: var(--m2); }
.spurzeile span, .figurzeile span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; font-size: var(--m1); color: var(--leise); }
.spurzeile:hover b, .figurzeile:hover b { color: var(--wasser); }
.messliste-knopf { display: flex; gap: 12px; align-items: baseline; width: 100%; margin: 0; padding: 11px 14px; text-align: left; background: var(--roetel-hauch); border: 0; border-radius: 8px; cursor: pointer; color: var(--tinte); }
.messliste-knopf b { font-weight: 500; }
.messliste-knopf span { margin-left: auto; color: var(--roetel); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fuss { margin: 36px 0 0; padding: 12px 0 24px; border-top: 1px solid var(--linie); font-size: var(--m1); color: var(--leise); }

/* Antwortleiste: bleibt am unteren Rand, solange man in der Frage liest */
.antwortleiste { position: sticky; bottom: var(--tabs); z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 32px calc(-1 * var(--rand)) 0; padding: 10px var(--rand); background: color-mix(in srgb, var(--papier) 90%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-top: 1px solid var(--linie); }
.antwortleiste > span { font-size: var(--m2); color: var(--leise); margin-right: 2px; }
.antwortleiste .haupt { border: 0; background: var(--wasser); color: var(--papier); border-radius: 999px; padding: 8px 20px; cursor: pointer; font-weight: 600; }
.antwortleiste .haupt:hover { opacity: .9; }
.antwortleiste .hinweise { margin-left: auto; font-size: var(--m1); color: var(--leise); background: none; border: 0; padding: 4px 0; font-weight: 400; }

/* Antworten und Formular */
.antwort { padding: 10px 0; border-top: 1px solid var(--linie); }
.antwort header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: var(--m2); }
.antwort header b { font-weight: 500; }
.antwort header span { color: var(--leise); font-size: var(--m1); }
.antwort p { margin: 4px 0 0; white-space: pre-wrap; }
.stimmen { margin: 0 0 4px; font-size: var(--m2); color: var(--leise); }
.uneinig { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 3px; background: var(--roetel-hauch); color: var(--roetel); font-size: var(--m1); }
.antworten-knopf { margin-top: 6px; background: none; border: 0; padding: 2px 0; color: var(--wasser); cursor: pointer; font-size: var(--m1); }
.antwort audio, .kommentar audio { display: block; margin-top: 8px; width: min(320px, 100%); }
.antwort-auf { margin: 0; font-size: var(--m2); color: var(--wasser); }

<script>
const K = /*__DATEN__*/null;
const REPO = "https://github.com/jdistlr/kleines-schaeferrad/blob/main/";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const zahl = n => typeof n === "number" ? n.toLocaleString("de-DE", { maximumFractionDigits: 3 }) : n;
const nach = (liste, f) => liste.slice().sort((a, b) => f(b) - f(a));

// ---------- Daten ----------
const teile = Object.fromEntries(K.bauteile.map(b => [b.id, b]));
const begriffe = Object.fromEntries(K.begriffe.map(b => [b.id, b]));
const personen = Object.fromEntries(K.personen.map(p => [p.id, p]));
const fragen = Object.fromEntries(K.fragen.map(f => [f.id, f]));
const quellen = Object.fromEntries(K.quellen.map(q => [q.id, q]));
const beziehungen = Object.fromEntries(K.beziehungen.map(b => [b.id, b]));
const angabenById = Object.fromEntries(K.angaben.map(a => [a.id, a]));
const kinder = {}; K.bauteile.forEach(b => { if (b.teil_von) (kinder[b.teil_von] ||= []).push(b.id); });
const unterteile = id => [id, ...(kinder[id] || []).flatMap(unterteile)];
const vorfahren = id => { const k = []; let p = teile[id]?.teil_von; while (p) { k.unshift(p); p = teile[p].teil_von; } return k; };
const angabenJe = {}, direktJe = {};
K.angaben.forEach(a => {
  if (teile[a.ziel]) (direktJe[a.ziel] ||= []).push(a);
  const ziele = teile[a.ziel] ? [a.ziel] : beziehungen[a.ziel] ? [beziehungen[a.ziel].von, beziehungen[a.ziel].zu] : [];
  [...new Set(ziele)].forEach(t => (angabenJe[t] ||= []).push(a));
});
const bezugVon = x => teile[x] ? [x] : teile[angabenById[x]?.ziel] ? [angabenById[x].ziel] : beziehungen[x] ? [beziehungen[x].von, beziehungen[x].zu] : quellen[x]?.bauteil ? [quellen[x].bauteil] : [];
const offen = K.fragen.filter(f => f.status === "offen");
const fragenJe = {};
offen.forEach(f => new Set([...f.betrifft, ...f.blockiert].flatMap(bezugVon)).forEach(t => (fragenJe[t] ||= []).push(f)));
const sammle = (je, id) => [...new Set(unterteile(id).flatMap(t => je[t] || []))];
const abhaengige = {}; K.fragen.forEach(f => f.haengt_ab_von.forEach(v => (abhaengige[v] ||= []).push(f.id)));
const freischaltet = id => { const s = new Set(), st = [...(abhaengige[id] || [])]; while (st.length) { const x = st.pop(); if (!s.has(x)) { s.add(x); st.push(...(abhaengige[x] || [])); } } return [...s]; };
const altLuecke = f => f.herkunft.some(h => h.startsWith("GAP-")) && !f.herkunft.some(h => h.startsWith("CLAIM-"));
const gewicht = f => freischaltet(f.id).length * 4 + Math.min(f.blockiert.length, 2) * 2 + (f.herkunft.length ? 0 : 3) - (f.haengt_ab_von.length ? 2 : 0) - (altLuecke(f) ? 20 : 0);
const rang = q => q.bildart === "messfoto" ? 3 : q.bildart === "konstruktionsfoto" ? 2 : q.art === "skizze" ? 1.5 : 1;
const fotosVon = ids => { const s = new Set(ids.flatMap(unterteile)); return nach(K.quellen.filter(q => q.bild && s.has(q.bauteil)), rang); };
const fotosZuFrage = f => {
  const namen = (f.hinweis || "").match(/IMG[_0-9A-Za-z-]+/g) || [];
  const genannt = K.quellen.filter(q => q.bild && namen.some(n => (q.pfad || "").includes(n)));
  const bez = [...new Set([...f.betrifft, ...f.blockiert].flatMap(bezugVon))].filter(t => teile[t] && teile[t].art !== "anlage");
  return [...new Set([...genannt, ...fotosVon(bez)])];
};
let paket = null;
const bildSrc = q => K.bilderPaket ? (paket?.[q.id] || "") : q.bild;
if (K.bilderPaket) fetch(K.bilderPaket).then(r => r.json()).then(p => { paket = p; zeige({ neu: false }); }).catch(() => {});
const kurz = (s, n = 110) => s.length > n ? s.slice(0, n - 2).replace(/\s\S*$/, "") + " …" : s;
const vorname = pid => (personen[pid]?.name || "").split(" ")[0];

const EINHEIT = { m: " m", cm: " cm", mm: " mm", grad: "°", anzahl: "", exporteinheit: " E" };
const GRUND = { messung: "gemessen", muendlich: "mündlich", skizze: "Skizze", foto: "Foto", scan: "Scan", ableitung: "berechnet", annahme: "Annahme", kontext: "Kontext", holzliste: "Holzliste", fremdvorlage: "Fremdvorlage" };
const GRUND_LANG = { messung: "Gemessen", muendlich: "Mündlich überliefert", skizze: "Aus Vereinsskizzen", foto: "Auf Fotos beobachtet", scan: "Aus dem 3D-Scan", ableitung: "Berechnet", annahme: "Annahme", kontext: "Kontext", holzliste: "Allgemeine Holzliste", fremdvorlage: "Fremde Vorlagen" };
const GUELT = { offen: "offen", bestaetigt: "bestätigt", historisch: "Unterlage", ueberholt: "überholt", verworfen: "verworfen" };

    .filter(r => r.p).sort((a, b) => b.p - a.p || (a.x.art === "Bauteil" ? -1 : 1)).slice(0, 8).map(r => r.x);
  auswahl = 0;
  trefferListe.innerHTML = liste.map((x, i) => `<li role="option" aria-selected="${i === 0}" data-gehe="${x.id}">${esc(x.titel)}<small>${x.art}</small></li>`).join("") || (w.length >= 2 ? `<li aria-disabled="true">Nichts gefunden</li>` : "");
  trefferListe.hidden = w.length < 2; suche.setAttribute("aria-expanded", String(!trefferListe.hidden));
}
suche.addEventListener("input", sucheAus);
suche.addEventListener("keydown", e => {
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && liste.length) { e.preventDefault(); auswahl = (auswahl + (e.key === "ArrowDown" ? 1 : -1) + liste.length) % liste.length; trefferListe.querySelectorAll("li").forEach((l, i) => l.setAttribute("aria-selected", String(i === auswahl))); }
  if (e.key === "Enter" && liste[auswahl]) { gehe(liste[auswahl].id); suche.value = ""; sucheAus(); suche.blur(); }
  if (e.key === "Escape") { suche.value = ""; sucheAus(); }
});
trefferListe.addEventListener("click", () => { suche.value = ""; sucheAus(); });
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "")) { e.preventDefault(); suche.focus(); } });
document.addEventListener("click", e => { if (!e.target.closest(".suche")) trefferListe.hidden = true; });

misseKopf();
zeige();
Speicher.start();
</script>
