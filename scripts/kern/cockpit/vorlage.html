<title>Kleines Schäferrad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Werkbank: oben eine schmale Leiste, links immer das Rad, rechts eine Karte, die nur in sich scrollt. */
:root {
  --papier: #edf1ec; --flaeche: #f6f8f5; --tinte: #1c2726; --leise: #5f6d6a; --linie: #c9d1cc;
  --wasser: #2b6a76; --wasser-hauch: #d6e6e8; --roetel: #a5412a; --roetel-hauch: #f3e2dc;
  --eiche: #4f6f2a; --holz: #e2d8c6; --holz-dunkel: #b9a88c; --fluss: #c9dcdc;
  --serif: "Alegreya", "Iowan Old Style", Georgia, serif;
  --sans: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --m1: .8125rem; --m2: .9375rem; --m3: 1.0625rem; --m4: 1.3125rem; --m5: 1.75rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papier: #121817; --flaeche: #1a2120; --tinte: #dfe6e2; --leise: #9aa8a4; --linie: #33403d;
  --wasser: #86bec7; --wasser-hauch: #20393d; --roetel: #e48c71; --roetel-hauch: #3a2520; --eiche: #a9c77a;
  --holz: #3a352b; --holz-dunkel: #6f6450; --fluss: #1d3033; color-scheme: dark; } }
:root[data-theme="dark"] {
  --papier: #121817; --flaeche: #1a2120; --tinte: #dfe6e2; --leise: #9aa8a4; --linie: #33403d;
  --wasser: #86bec7; --wasser-hauch: #20393d; --roetel: #e48c71; --roetel-hauch: #3a2520; --eiche: #a9c77a;
  --holz: #3a352b; --holz-dunkel: #6f6450; --fluss: #1d3033; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--papier); color: var(--tinte); font: 400 var(--m3)/1.5 var(--sans); margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--wasser); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--wasser); outline-offset: 2px; border-radius: 3px; }
.leise { color: var(--leise); }
.zahl { font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); max-width: 1440px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); }

.leiste { display: flex; align-items: center; gap: 10px 24px; flex-wrap: wrap; padding-block: 14px; border-bottom: 1px solid var(--linie); }
.leiste h1 { font: 700 var(--m4)/1 var(--serif); margin: 0; white-space: nowrap; }
.leiste h1 a { color: inherit; text-decoration: none; }
.stand-mini { display: flex; align-items: center; gap: 10px; font-size: var(--m2); color: var(--leise); }
.stand-mini .balken { width: 120px; height: 6px; border-radius: 3px; background: var(--linie); overflow: hidden; display: flex; }
.balken i { display: block; height: 100%; }
.suche { position: relative; margin-left: auto; flex: 0 1 320px; min-width: 200px; }
.suche input { width: 100%; padding: 8px 12px; border: 1px solid var(--linie); border-radius: 6px; background: var(--flaeche); }
.suche input::placeholder { color: var(--leise); }
.treffer-liste { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); max-height: 60vh; overflow: auto; }
.treffer-liste li { padding: 7px 10px; border-radius: 4px; cursor: pointer; }
.treffer-liste li[aria-selected="true"], .treffer-liste li:hover { background: var(--wasser-hauch); }
.treffer-liste small { display: block; color: var(--leise); font-size: var(--m1); }

.werkbank { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, 1fr); gap: 32px; min-height: 0; padding-top: 16px; }
.rad { min-height: 0; display: flex; flex-direction: column; position: relative; }
.rad svg#aufriss { width: 100%; height: auto; max-height: calc(100% - 52px); display: block; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0; padding: 0; list-style: none; font-size: var(--m1); color: var(--leise); }
.legende li { display: flex; align-items: center; gap: 6px; }
.legende svg { width: 22px; height: 12px; }
.etikett { position: absolute; pointer-events: none; background: var(--tinte); color: var(--papier); font-size: var(--m2); padding: 3px 9px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 5; }

svg .teil { cursor: pointer; }
svg .teil .form { fill: var(--holz); stroke: var(--tinte); stroke-width: 1.3; transition: fill .15s; }
svg .teil .treffer { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; }
svg .teil.leer .form { fill: none; stroke-dasharray: 4 3; stroke: var(--leise); }
svg .teil.bestaetigt .form { fill: color-mix(in srgb, var(--eiche) 32%, var(--holz)); }
svg .teil:hover .form, svg .teil:focus-visible .form { fill: var(--wasser-hauch); }
svg .teil.gewaehlt .form { stroke: var(--wasser); stroke-width: 2.4; fill: var(--wasser-hauch); }
svg .teil:focus-visible { outline: none; }
svg .marke circle { fill: var(--roetel); stroke: var(--papier); stroke-width: 2; }
svg .marke text { fill: #fff; font: 700 12px var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
svg .fluss { fill: var(--fluss); }
svg .welle { fill: none; stroke: var(--wasser); stroke-width: 1; opacity: .7; }
svg .gelaende { fill: none; stroke: var(--leise); stroke-width: 1.2; }
svg .schraffur { stroke: var(--linie); stroke-width: 1; }
svg .wasserweg { fill: none; stroke: var(--wasser); stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }

.karte { min-height: 0; overflow-y: auto; padding: 4px 6px 48px 2px; overscroll-behavior: contain; }
.zurueck { background: none; border: 0; padding: 4px 0; color: var(--wasser); cursor: pointer; font-size: var(--m2); }
.pfad { color: var(--leise); font-size: var(--m2); margin: 8px 0 2px; }
.karte h2 { font: 700 var(--m5)/1.12 var(--serif); margin: 0; text-wrap: balance; }
.karte h2.frage-titel { font-weight: 500; }
.karte h3 { font: 500 var(--m4)/1.2 var(--serif); margin: 28px 0 10px; }
.karte h3 small { font: 400 var(--m2) var(--sans); color: var(--leise); margin-left: 6px; }
.definition { font: italic 400 var(--m3)/1.45 var(--serif); color: var(--leise); margin: 6px 0 0; max-width: 58ch; }
.auch { font-size: var(--m2); color: var(--leise); margin: 6px 0 0; }
.hinweis { margin: 12px 0 0; padding: 10px 14px; background: var(--flaeche); border-left: 3px solid var(--holz-dunkel); font-size: var(--m2); max-width: 62ch; }
.einstieg { font: 400 var(--m4)/1.35 var(--serif); margin: 0; max-width: 36ch; text-wrap: balance; }
.klein { font-size: var(--m2); margin: 0 0 4px; }

.wissen { margin: 18px 0 0; padding: 14px 16px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; }
.wissen .balken { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--linie); }
.wissen p { margin: 10px 0 0; font-size: var(--m2); }
.wissen dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0; }
.wissen dt { font-size: var(--m1); color: var(--leise); }
.wissen dd { margin: 0; font: 500 var(--m4)/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.wissen dd span { font: 400 var(--m2) var(--sans); color: var(--leise); }

.fragekarte { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; width: 100%; text-align: left; padding: 12px; margin-top: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; cursor: pointer; }
.fragekarte:hover { border-color: var(--wasser); }
.fragekarte.ohne-bild { grid-template-columns: minmax(0, 1fr); }
.fragekarte img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; background: var(--linie); }
.fragekarte b { display: block; font-weight: 500; line-height: 1.35; }
.fragekarte span { display: block; margin-top: 4px; font-size: var(--m1); color: var(--leise); }
.spur { margin-top: 10px; padding: 12px 14px; background: var(--wasser-hauch); border-radius: 8px; font-size: var(--m2); max-width: 62ch; }
.spur b { display: block; font: 500 var(--m1)/1.2 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--wasser); margin-bottom: 4px; }
.spurkarte { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-top: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-left: 3px solid var(--wasser); border-radius: 8px; cursor: pointer; }
.spurkarte:hover { border-color: var(--wasser); }
.spurkarte b { display: block; font-weight: 500; line-height: 1.35; }
.spurkarte span { display: block; margin-top: 4px; font-size: var(--m2); color: var(--leise); }
.belege { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; align-items: center; }
.belege button { padding: 0; border: 1px solid var(--linie); background: var(--linie); border-radius: 4px; cursor: pointer; line-height: 0; }
.belege button:hover { border-color: var(--wasser); }
.belege img { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; display: block; }
.belege .text { font: 400 var(--m1)/1.3 var(--sans); color: var(--wasser); text-decoration: none; }
.belege .mehr { font: 400 var(--m1) var(--sans); color: var(--leise); }
table.angaben .belege img { width: 36px; height: 36px; }
.bildfenster .abgelesen { display: block; width: 100%; color: #fff; font-size: var(--m3); }
.abgleich { display: block; font: 400 var(--m1) var(--sans); margin-top: 3px; }
.abgleich.gleich { color: var(--eiche); }
.abgleich.anders { color: var(--roetel); }
.auftrag { margin-top: 10px; padding: 12px 14px; border: 1px dashed var(--roetel); border-radius: 8px; font-size: var(--m2); max-width: 62ch; }
.auftrag b { display: block; font: 500 var(--m1)/1.2 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--roetel); margin-bottom: 4px; }
.messliste-knopf { display: flex; gap: 12px; align-items: center; width: 100%; margin: 18px 0 0; padding: 12px 14px; text-align: left; background: var(--roetel-hauch); border: 1px solid var(--roetel); border-radius: 8px; cursor: pointer; color: var(--tinte); }
.messliste-knopf b { font-weight: 500; }
.messliste-knopf span { margin-left: auto; color: var(--roetel); font-weight: 500; white-space: nowrap; }
.posten { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 14px 0; border-top: 1px solid var(--linie); }
.posten input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--eiche); }
.posten h4 { margin: 0; font: 500 var(--m3)/1.35 var(--sans); }
.posten h4 a { color: inherit; text-decoration: none; }
.posten p { margin: 6px 0 0; font-size: var(--m2); max-width: 62ch; }
.posten .fotos img { width: 96px; height: 96px; }
.posten.erledigt h4, .posten.erledigt p { color: var(--leise); text-decoration: line-through; text-decoration-thickness: 1px; }
@media print { .rad, .leiste, .zurueck, .posten .fotos, .knopf-zeile { display: none !important; } .app, .werkbank { display: block; height: auto; } .karte { overflow: visible; } body { background: #fff; } }
.blaetter { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.blatt { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.blatt:hover { border-color: var(--wasser); }
.blatt img { width: 96px; height: 96px; object-fit: cover; border-radius: 4px; background: var(--linie); }
.blatt b { display: block; font-weight: 500; font-size: var(--m2); line-height: 1.3; }
.blatt ul { margin: 4px 0 0; padding: 0; list-style: none; font-size: var(--m1); color: var(--leise); }
.blatt li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quellbild { display: block; width: 100%; max-height: 62vh; object-fit: contain; background: var(--linie); border-radius: 8px; margin-top: 12px; cursor: zoom-in; }
.lesungen { margin: 0; padding: 0; list-style: none; }
.lesungen li { padding: 9px 0; border-top: 1px solid var(--linie); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
.lesungen .wo { grid-column: 1 / -1; font-size: var(--m1); color: var(--leise); }
.lesungen .w { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.vorgehen-link { font-size: var(--m2); white-space: nowrap; }
.prosa { max-width: 64ch; }
.prosa h3 { margin-top: 24px; }
.prosa ul, .prosa ol { padding-left: 1.2em; margin: 6px 0 0; }
.prosa li { margin: 4px 0; }
.prosa p { margin: 8px 0 0; }
.fuss { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--linie); font-size: var(--m1); color: var(--leise); }
.figurkachel { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-top: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-left: 3px solid var(--wasser); border-radius: 8px; cursor: pointer; }
.figurkachel:hover { border-color: var(--wasser); }
.figurkachel b { display: block; font: 500 var(--m3)/1.3 var(--serif); }
.figurkachel span { display: block; margin-top: 4px; font-size: var(--m1); color: var(--leise); }
.bildfenster iframe { display: block; width: min(980px, 100%); height: min(86vh, 900px); border: 0; border-radius: 6px; background: var(--papier); }
.fragezeile { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--linie); padding: 10px 2px; cursor: pointer; }
.fragezeile:hover b { color: var(--wasser); }
.fragezeile b { font-weight: 400; }
.fragezeile span { display: block; font-size: var(--m1); color: var(--leise); margin-top: 2px; }
details.gruppe { border-top: 1px solid var(--linie); }
details.gruppe:last-of-type { border-bottom: 1px solid var(--linie); }
details.gruppe > summary { cursor: pointer; padding: 11px 2px; list-style: none; display: flex; gap: 12px; font-weight: 500; }
details.gruppe > summary::-webkit-details-marker { display: none; }
details.gruppe > summary::after { content: "+"; color: var(--leise); width: 1ch; text-align: center; }
details.gruppe[open] > summary::after { content: "–"; }
details.gruppe > summary small { margin-left: auto; color: var(--leise); font-weight: 400; }
details.gruppe .innen { padding-bottom: 8px; }

.masse { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0; }
.masse div { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.masse dt { font-size: var(--m1); color: var(--leise); line-height: 1.3; }
.masse dd { margin: 4px 0 0; font: 500 var(--m4)/1.15 var(--serif); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.masse dd small { display: block; font: 400 var(--m1) var(--sans); color: var(--leise); margin-top: 3px; }
.leer-text { color: var(--leise); font-size: var(--m2); margin: 0; }

.fotos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.fotos button { flex: none; padding: 0; border: 0; background: none; cursor: pointer; position: relative; scroll-snap-align: start; border-radius: 6px; }
.fotos img { width: 128px; height: 128px; object-fit: cover; border-radius: 6px; display: block; background: var(--linie); }
.fotos .art { position: absolute; left: 6px; bottom: 6px; background: rgb(0 0 0 / .62); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 2px 11px; font-size: var(--m2); cursor: pointer; }
.chips button:hover { border-color: var(--wasser); color: var(--wasser); }

details.alle { margin-top: 24px; border-top: 1px solid var(--linie); }
details.alle > summary { cursor: pointer; padding: 12px 0; color: var(--wasser); }
table.angaben { width: 100%; border-collapse: collapse; font-size: var(--m2); }
table.angaben td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--linie); vertical-align: top; }
table.angaben td:first-child { width: 50%; overflow-wrap: anywhere; }
table.angaben td.wert { font-variant-numeric: tabular-nums; font-weight: 500; overflow-wrap: anywhere; }
table.angaben .gruppe td { padding-top: 14px; color: var(--leise); font: italic var(--m2) var(--serif); border-bottom: 0; }
table.angaben .bezug { font-size: var(--m1); color: var(--leise); }
.status { white-space: nowrap; color: var(--leise); font-size: var(--m1); }
.status.bestaetigt { color: var(--eiche); font-weight: 500; }

.antwort { padding: 10px 0; border-top: 1px solid var(--linie); }
.antwort header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: var(--m2); }
.antwort header b { font-weight: 500; }
.antwort header span { color: var(--leise); font-size: var(--m1); }
.antwort p { margin: 4px 0 0; white-space: pre-wrap; }
.antwort-bilder { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.antwort-bilder img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; display: block; background: var(--linie); }
.kommentar { margin: 8px 0 0 14px; padding: 6px 0 0 12px; border-left: 2px solid var(--linie); }
.kommentar header { display: flex; gap: 8px; font-size: var(--m1); }
.kommentar header span { color: var(--leise); }
.antwort header .marker-art { font-size: var(--m1); padding: 0 7px; border-radius: 3px; background: var(--wasser-hauch); color: var(--wasser); }
.antwort header .marker-art.nein { background: var(--roetel-hauch); color: var(--roetel); }
.formular { margin-top: 12px; padding: 14px; border: 1px solid var(--linie); border-radius: 8px; background: var(--flaeche); display: grid; gap: 10px; }
.wahl { display: flex; flex-wrap: wrap; gap: 6px; }
.wahl button { border: 1px solid var(--linie); background: var(--papier); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
.wahl button[aria-pressed="true"] { background: var(--tinte); color: var(--papier); border-color: var(--tinte); }
.formular label { font-size: var(--m2); color: var(--leise); display: grid; gap: 4px; }
.formular textarea, .formular input { width: 100%; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--papier); color: var(--tinte); }
.formular textarea { min-height: 84px; resize: vertical; }
.reihe { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reihe label { flex: 1 1 160px; }
.knopf { border: 0; background: var(--wasser); color: var(--papier); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.knopf:disabled { opacity: .5; cursor: default; }
.nurlesen { font-size: var(--m2); color: var(--leise); margin: 10px 0 0; }

.bildfenster { position: fixed; inset: 0; z-index: 50; background: rgb(10 14 14 / .84); display: grid; place-items: center; padding: 24px 16px; }
.bildfenster figure { margin: 0; max-width: min(960px, 100%); }
.bildfenster img { max-width: 100%; max-height: 78vh; border-radius: 6px; display: block; margin: 0 auto; }
.bildfenster figcaption { color: #e6ecea; font-size: var(--m2); margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
.bildfenster a { color: #9fd0d8; }
.bildfenster .betrachter { width: min(1100px, 100%); }
.buehne { position: relative; height: min(72vh, 820px); overflow: hidden; display: grid; place-items: center; touch-action: none; cursor: grab; border-radius: 6px; background: rgb(0 0 0 / .25); }
.buehne:active { cursor: grabbing; }
.buehne img { max-width: 100%; max-height: 100%; border-radius: 0; user-select: none; -webkit-user-drag: none; transform-origin: center; will-change: transform; }
.bildfenster .buehne img { max-height: 100%; margin: 0; }
.werkzeuge { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.werkzeuge button { min-width: 40px; height: 36px; padding: 0 12px; border: 1px solid rgb(255 255 255 / .28); background: rgb(255 255 255 / .08); color: #fff; border-radius: 6px; cursor: pointer; font-size: 17px; }
.werkzeuge button:hover { background: rgb(255 255 255 / .18); }
.werkzeuge button[data-bb="passen"] { font-size: var(--m2); }
.zoomwert { color: #e6ecea; font-size: var(--m2); min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.bildfenster > button { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 16px; background: none; border: 0; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; padding: 6px 10px; }

<script>
const K = /*__DATEN__*/null;
const REPO = "https://github.com/jdistlr/kleines-schaeferrad/blob/main/";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const zahl = n => typeof n === "number" ? n.toLocaleString("de-DE", { maximumFractionDigits: 3 }) : n;
const nach = (liste, f) => liste.slice().sort((a, b) => f(b) - f(a));

// ---------- Daten ----------
const teile = Object.fromEntries(K.bauteile.map(b => [b.id, b]));
const begriffe = Object.fromEntries(K.begriffe.map(b => [b.id, b]));
const personen = Object.fromEntries(K.personen.map(p => [p.id, p]));
const fragen = Object.fromEntries(K.fragen.map(f => [f.id, f]));
const quellen = Object.fromEntries(K.quellen.map(q => [q.id, q]));
const beziehungen = Object.fromEntries(K.beziehungen.map(b => [b.id, b]));
const angabenById = Object.fromEntries(K.angaben.map(a => [a.id, a]));
const kinder = {}; K.bauteile.forEach(b => { if (b.teil_von) (kinder[b.teil_von] ||= []).push(b.id); });
const unterteile = id => [id, ...(kinder[id] || []).flatMap(unterteile)];
const vorfahren = id => { const k = []; let p = teile[id]?.teil_von; while (p) { k.unshift(p); p = teile[p].teil_von; } return k; };
const angabenJe = {}, direktJe = {};
K.angaben.forEach(a => {
  if (teile[a.ziel]) (direktJe[a.ziel] ||= []).push(a);
  const ziele = teile[a.ziel] ? [a.ziel] : beziehungen[a.ziel] ? [beziehungen[a.ziel].von, beziehungen[a.ziel].zu] : [];
  [...new Set(ziele)].forEach(t => (angabenJe[t] ||= []).push(a));
});
const bezugVon = x => teile[x] ? [x] : teile[angabenById[x]?.ziel] ? [angabenById[x].ziel] : beziehungen[x] ? [beziehungen[x].von, beziehungen[x].zu] : quellen[x]?.bauteil ? [quellen[x].bauteil] : [];
const offen = K.fragen.filter(f => f.status === "offen");
const fragenJe = {};
offen.forEach(f => new Set([...f.betrifft, ...f.blockiert].flatMap(bezugVon)).forEach(t => (fragenJe[t] ||= []).push(f)));
const sammle = (je, id) => [...new Set(unterteile(id).flatMap(t => je[t] || []))];
const abhaengige = {}; K.fragen.forEach(f => f.haengt_ab_von.forEach(v => (abhaengige[v] ||= []).push(f.id)));
const freischaltet = id => { const s = new Set(), st = [...(abhaengige[id] || [])]; while (st.length) { const x = st.pop(); if (!s.has(x)) { s.add(x); st.push(...(abhaengige[x] || [])); } } return [...s]; };
const altLuecke = f => f.herkunft.some(h => h.startsWith("GAP-")) && !f.herkunft.some(h => h.startsWith("CLAIM-"));
const gewicht = f => freischaltet(f.id).length * 4 + Math.min(f.blockiert.length, 2) * 2 + (f.herkunft.length ? 0 : 3) - (f.haengt_ab_von.length ? 2 : 0) - (altLuecke(f) ? 20 : 0);
const rang = q => q.bildart === "messfoto" ? 3 : q.bildart === "konstruktionsfoto" ? 2 : q.art === "skizze" ? 1.5 : 1;
const fotosVon = ids => { const s = new Set(ids.flatMap(unterteile)); return nach(K.quellen.filter(q => q.bild && s.has(q.bauteil)), rang); };
const fotosZuFrage = f => {
  const namen = (f.hinweis || "").match(/IMG[_0-9A-Za-z-]+/g) || [];
  const genannt = K.quellen.filter(q => q.bild && namen.some(n => (q.pfad || "").includes(n)));
  const bez = [...new Set([...f.betrifft, ...f.blockiert].flatMap(bezugVon))].filter(t => teile[t] && teile[t].art !== "anlage");
  return [...new Set([...genannt, ...fotosVon(bez)])];
};
let paket = null;
const bildSrc = q => K.bilderPaket ? (paket?.[q.id] || "") : q.bild;
if (K.bilderPaket) fetch(K.bilderPaket).then(r => r.json()).then(p => { paket = p; zeige({ neu: false }); }).catch(() => {});
const kurz = (s, n = 110) => s.length > n ? s.slice(0, n - 2).replace(/\s\S*$/, "") + " …" : s;
const vorname = pid => (personen[pid]?.name || "").split(" ")[0];

const EINHEIT = { m: " m", cm: " cm", mm: " mm", grad: "°", anzahl: "", exporteinheit: " E" };
const GRUND = { messung: "gemessen", muendlich: "mündlich", skizze: "Skizze", foto: "Foto", scan: "Scan", ableitung: "berechnet", annahme: "Annahme", kontext: "Kontext", holzliste: "Holzliste", fremdvorlage: "Fremdvorlage" };
const GRUND_LANG = { messung: "Gemessen", muendlich: "Mündlich überliefert", skizze: "Aus Vereinsskizzen", foto: "Auf Fotos beobachtet", scan: "Aus dem 3D-Scan", ableitung: "Berechnet", annahme: "Annahme", kontext: "Kontext", holzliste: "Allgemeine Holzliste", fremdvorlage: "Fremde Vorlagen" };
const GUELT = { offen: "offen", bestaetigt: "bestätigt", historisch: "Unterlage", ueberholt: "überholt", verworfen: "verworfen" };
const BILDART = { messfoto: "Messfoto", konstruktionsfoto: "Detail", uebersicht: "Übersicht" };
const TYPEN = { stimmt: "Stimmt so", stimmt_nicht: "Stimmt nicht", genauer: "Ich weiß es genauer", ergaenzung: "Ergänzung", korrektur: "Korrektur" };
const eig = s => begriffe[s]?.name || s.replaceAll("_", " ");
function wertText(a) {
  const f = v => v === true ? "ja" : v === false ? "nein" : v === null ? "–" : typeof v === "number" ? zahl(v)
    : Array.isArray(v) ? v.map(f).join(" × ") : typeof v === "object" ? Object.entries(v).map(([k, x]) => `${k.replaceAll("_", " ")}: ${f(x)}`).join("; ") : String(v);
  let t = f(a.wert) + (a.einheit && typeof a.wert !== "boolean" ? (EINHEIT[a.einheit] ?? " " + a.einheit) : "");
  if (!a.einheit && a.grund === "skizze" && typeof a.wert === "number") t += " (Einheit nicht angegeben)";
  if (a.tol?.art === "ungefaehr") t = "ca. " + t;
  if (a.tol?.art === "bereich") t += ` (${zahl(a.tol.von)}–${zahl(a.tol.bis)})`;
  if (a.tol?.art === "vereinfachung") t += ", vereinfacht";
  return t;
}
// Neue Spuren: Fragen tragen im Hinweis Absätze „Stand TT.MM.JJJJ: …“; die werden hervorgehoben.
const SPUR = /\s*Stand (\d{1,2}\.\d{1,2}\.\d{4}): /;
const AUFTRAG = /\s*Messauftrag (\d{1,2}\.\d{1,2}\.\d{4}): ([\s\S]*?)(?=\s*(?:Stand|Messauftrag) \d{1,2}\.\d{1,2}\.\d{4}: |$)/;
const auftragVon = h => { const m = (h || "").match(AUFTRAG); return m ? { datum: m[1], text: m[2].trim() } : null; };
const ohneAuftrag = h => (h || "").replace(AUFTRAG, "").trim();
const teileHinweis = h0 => { const h = ohneAuftrag(h0); const i = (h || "").search(SPUR); if (i < 0) return { alt: h || "", spuren: [] }; const rest = h.slice(i); const spuren = rest.split(/(?=Stand \d{1,2}\.\d{1,2}\.\d{4}: )/).map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^Stand (\S+): ([\s\S]*)$/); return m ? { datum: m[1], text: m[2] } : { datum: "", text: x }; }); return { alt: h.slice(0, i).trim(), spuren }; };
const KERN_ID = /\b(?:AN-\d{8}-\d{2}|TH-\d{8}-\d{2}|CLAIM-\d{4})\b/g;
const genannteAngaben = text => [...new Set((text || "").match(KERN_ID) || [])].map(id => angabenById[id]).filter(Boolean);
// Mit IDs in Bereichen („AN-20261012-27/28“) auch die Folge-IDs auflösen
const genannteAngabenVoll = text => { const ids = new Set(); (text || "").replace(/\b(AN-\d{8}-)(\d{2})((?:\/\d{2})+)/g, (m, p, a, r) => { ids.add(p + a); r.split("/").filter(Boolean).forEach(n => ids.add(p + n)); return m; }); return [...new Set([...genannteAngaben(text), ...[...ids].map(i => angabenById[i]).filter(Boolean)])]; };
const zahlenVon = a => typeof a.wert === "number" ? [a.wert] : Array.isArray(a.wert) && a.wert.every(x => typeof x === "number") ? a.wert : null;
// Skizzenmaße ohne Einheit sind je nach Blatt cm oder mm: beide Lesarten prüfen.
const inMeter = (a, v) => a.einheit === "m" ? [v] : a.einheit === "cm" ? [v / 100] : a.einheit === "mm" ? [v / 1000] : !a.einheit && a.grund === "skizze" ? [v / 100, v / 1000] : null;
function abgleich(a, alle) {
  const za = zahlenVon(a); if (!za) return "";
  const nah = (x, y) => x && Math.abs(y - x) / x < 0.06;
  const gleichWerte = (b, zb) => za.length === zb.length && za.every((v, i) => { const xs = inMeter(a, v), ys = inMeter(b, zb[i]); return xs && ys && xs.some(x => ys.some(y => nah(x, y))); });
  const andere = alle.filter(b => b !== a && b.eig.replace(/_skizze$/, "") === a.eig.replace(/_skizze$/, "") && b.grund !== a.grund && b.guelt !== "ueberholt");
  const teile_ = andere.map(b => { const z = zahlenVon(b); if (!z || z.length !== za.length || !inMeter(b, z[0])) return null; return { b, gleich: gleichWerte(b, z) }; }).filter(Boolean);
  if (!teile_.length) return "";
  const g = teile_.filter(x => x.gleich), n = teile_.filter(x => !x.gleich);
  // Auch die Gegenquelle zum Nachprüfen vorlegen (je ein Beleg).
  return (g.length ? `<span class="abgleich gleich">${[...new Set(g.map(x => GRUND[x.b.grund]))].join(", ")} stützt das</span>${g.slice(0, 2).map(x => belege(x.b, 1)).join("")}` : "") +
    (n.length ? `<span class="abgleich anders">${n.map(x => `${GRUND[x.b.grund]}: ${esc(wertText(x.b))}`).join("; ")}</span>${n.slice(0, 2).map(x => belege(x.b, 1)).join("")}` : "");
}
// Belege: die Quellen einer Angabe als kleine Vorschaubilder (Fotos, Skizzen) oder Textverweise.
const ARTNAME = { aussage: "Aussage", dokument: "Dokument", kontext: "Kontext", ableitung: "Herleitung", scan: "Scan", video: "Video" };
function belege(a, max = 4) {
  const liste = (a.quellen || []).map(([qid, stelle]) => ({ q: quellen[qid], stelle })).filter(x => x.q);
  if (!liste.length) return "";
  const bilder = liste.filter(x => x.q.bild), texte = liste.filter(x => !x.q.bild);
  const b = bilder.slice(0, max).map(x => `<button data-foto="${x.q.id}" data-angabe="${esc(a.id)}" data-stelle="${esc(x.stelle || "")}" aria-label="Beleg öffnen: ${esc(x.q.titel || x.q.id)}"><img src="${bildSrc(x.q)}" alt="" loading="lazy"></button>`).join("");
  const t = texte.slice(0, 2).map(x => x.q.pfad ? `<a class="text" href="${REPO + encodeURI(x.q.pfad)}" target="_blank" rel="noopener">${esc(ARTNAME[x.q.art] || "Quelle")}: ${esc(kurz(x.q.titel || x.q.id, 40))}</a>` : `<span class="mehr">${esc(ARTNAME[x.q.art] || "Quelle")}: ${esc(kurz(x.q.titel || x.q.id, 40))}</span>`).join("");
  const rest = bilder.length - Math.min(bilder.length, max) + Math.max(0, texte.length - 2);
  return `<span class="belege">${b}${t}${rest > 0 ? `<span class="mehr">+${rest}</span>` : ""}</span>`;

const istMass = a => (a.grund === "skizze" && !a.einheit && typeof a.wert === "number") || (typeof a.wert === "number" || (Array.isArray(a.wert) && a.wert.length && a.wert.every(x => typeof x === "number"))) && a.einheit && a.einheit !== "exporteinheit";

// ---------- Speicher für Antworten: Claude-Arbeitsfassung, später eigener Server ----------
const Speicher = {
  modus: "lesen", antworten: [], namen: {}, uid: null, hoerer: [],
  melde() { this.hoerer.forEach(f => f()); },
  async start() {
    if (K.api) return this.ladeServer();
    if (typeof claude === "undefined" || !claude.use) return this.ladeGithub();
    try {
      const db = await claude.use("db"); if (!db) return;
      const user = await claude.use("user");
      this.user = user; this.uid = user ? await user.id() : null;
      const darf = user ? await user.can("data.write") : null;
      this.modus = darf === false ? "lesen" : "claude";
      this.col = db.collection("antworten");
      this.col.orderBy("am").onSnapshot(async s => {
        this.antworten = s.docs.map(d => ({ id: d.id, ...d.data() }));
        if (this.user) { const ids = [...new Set(this.antworten.map(a => a.von).filter(Boolean))]; const ps = await this.user.profiles(ids); this.namen = Object.fromEntries(ids.map(i => [i, ps[i]?.name || ""])); }
        this.melde();
      }, () => { this.modus = "lesen"; this.melde(); });
      this.melde();
    } catch { this.modus = "lesen"; }
  },
  // GitHub Pages: Antworten sind öffentliche Issues mit dem Label „antwort“. Lesen geht ohne Anmeldung,
  // Schreiben öffnet ein vorausgefülltes Issue (GitHub-Konto nötig). Johannes und Claude sammeln sie ein.
  GH: "jdistlr/kleines-schaeferrad",
  async ladeGithub() {
    this.modus = "github";
    // Zuerst der Abzug aus dem Repository (evidence/antworten/antworten.json): sofort da, mit Kommentaren,
    // ohne GitHub-Abfragegrenze. Danach live nur, was neu oder geändert ist.
    const abzug = new Map((K.antwortenAbzug || []).map(a => [a.nr, a]));
    this.antworten = [...abzug.values()]; this.melde();
    const BILD = /!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)|<img[^>]+src="(https?:\/\/[^"]+)"/g;
    const bilder = t => [...(t || "").matchAll(BILD)].map(m => m[1] || m[2]);
    const ohneBilder = t => (t || "").replace(BILD, "").trim();
    const hole = async url => { const r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } }); if (!r.ok) throw new Error(String(r.status)); return r.json(); };
    try {
      let issues = [];
      for (let seite = 1; seite <= 5; seite++) {
        const teil = await hole(`https://api.github.com/repos/${this.GH}/issues?state=all&per_page=100&page=${seite}`);
        issues = issues.concat(teil); if (teil.length < 100) break;
      }
      let nachladen = 0;
      const liste = [];
      for (const i of issues) {
        if (i.pull_request) continue;
        const m = (i.body || "").match(/<!--\s*antwort([\s\S]*?)-->/); if (!m) continue;
        const alt = abzug.get(i.number);
        if (alt && alt.geaendert === i.updated_at) { liste.push(alt); continue; }
        const f = {}; m[1].split("\n").forEach(z => { const k = z.match(/^\s*(\w+):\s*(.*)$/); if (k) f[k[1]] = k[2].trim(); });
        const text = (i.body || "").replace(/<!--[\s\S]*?-->/, "").replace("_Aus dem Cockpit. Fotos können hier per Ziehen oder Einfügen angehängt werden._", "").trim();
        let kommentare = alt?.kommentare || [];
        if (i.comments && i.comments !== kommentare.length && nachladen < 8) {
          nachladen++;
          try { kommentare = (await hole(i.comments_url + "?per_page=100")).map(c => ({ name: c.user?.login || "", am: c.created_at, text: ohneBilder(c.body), bilder: bilder(c.body) })); } catch {}
        }

          uebernommen: (i.labels || []).some(l => l.name === "im-kern"), kommentare });
      }
      this.antworten = liste.filter(a => a.ziel).sort((a, b) => a.am.localeCompare(b.am));
      this.melde();
    } catch { this.melde(); }
  },
  async ladeServer() {
    try {
      const r = await fetch(K.api + "?aktion=liste", { credentials: "include" });
      if (!r.ok) throw new Error(String(r.status));
      this.antworten = await r.json(); this.modus = "server"; this.melde();
    } catch { this.modus = "lesen"; this.melde(); }
  },
  async speichern(a) {
    const eintrag = { ...a, am: new Date().toISOString(), uebernommen: false };
    if (this.modus === "claude") { eintrag.von = this.uid; await this.col.add(eintrag); return; }
    if (this.modus === "server") {
      const r = await fetch(K.api + "?aktion=speichern", { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify(eintrag) });
      if (!r.ok) throw new Error(String(r.status));
      return this.ladeServer();
    }
    if (this.modus === "github") {
      const titel = `Antwort zu ${a.ziel}: ${(teile[a.ziel]?.name || fragen[a.ziel]?.frage || quellen[a.ziel]?.titel || (a.ziel === "VORGEHEN" ? "Wie wir vorgehen" : "")).slice(0, 70)}`;
      const body = `<!-- antwort\nziel: ${a.ziel}\ntyp: ${a.typ}\nwert: ${(a.wert || "").replace(/\n/g, " ")}\n-->\n${a.text || ""}\n\n_Aus dem Cockpit. Fotos können hier per Ziehen oder Einfügen angehängt werden._`;
      window.open(`https://github.com/${this.GH}/issues/new?labels=antwort&title=${encodeURIComponent(titel)}&body=${encodeURIComponent(body)}`, "_blank", "noopener");
      return "github";
    }
    throw new Error("nur lesen");
  },
  zu(ziel) { return this.antworten.filter(a => a.ziel === ziel); },
  name(a) { return a.name || this.namen[a.von] || "Jemand"; },
};

const NS = "http://www.w3.org/2000/svg", svg = $("#aufriss");

const C = { x: 300, y: 235 }, RA = 176, RI = 160, RS = 214;

const gruppen = {};

function md(text) {
  const zeilen = (text || "").split("\n"); let html = "", liste = null;

  const schliessen = () => { if (liste) { html += `</${liste}>`; liste = null; } };
  for (const z of zeilen) {
    let m;
    if (/^# /.test(z)) continue;
    if ((m = z.match(/^## (.*)/))) { schliessen(); html += `<h3>${inline(m[1])}</h3>`; continue; }
    if ((m = z.match(/^- (.*)/))) { if (liste !== "ul") { schliessen(); html += "<ul>"; liste = "ul"; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = z.match(/^\d+\. (.*)/))) { if (liste !== "ol") { schliessen(); html += "<ol>"; liste = "ol"; } html += `<li>${inline(m[1])}</li>`; continue; }
    if (!z.trim()) { schliessen(); continue; }

  }
  schliessen(); return html;
}
