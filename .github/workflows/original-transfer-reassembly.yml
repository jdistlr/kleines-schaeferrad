name: One-time original video reassembly
on:
  push:
    branches: [work/evidence-graph-consolidation-20261010]
    paths:
      - 'state/evidence-consolidation/20261010/video-transfer/**'
      - '.github/workflows/original-transfer-reassembly.yml'
permissions:
  contents: write
concurrency:
  group: original-transfer-reassembly-20261010
  cancel-in-progress: false
jobs:
  reassemble:
    if: github.repository == 'jdistlr/kleines-schaeferrad' && github.ref == 'refs/heads/work/evidence-graph-consolidation-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify parts and reconstruct unchanged original
        run: python3 state/evidence-consolidation/20261010/video-transfer/reassemble.py
      - name: Verify all 77 original files
        run: python3 state/evidence-consolidation/20261010/verify-original-transfer.py
      - name: Commit only original video and reassembly receipt to the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evidence/raw/originaltransfer-20261010/IMG_6857.mp4 state/evidence-consolidation/20261010/video-reassembly-receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: reconstruct unchanged original video from verified transport parts'
          git push origin HEAD:refs/heads/work/evidence-graph-consolidation-20261010
